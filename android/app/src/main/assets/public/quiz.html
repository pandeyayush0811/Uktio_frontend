<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://utkio-backend.onrender.com http://10.215.18.30:3999 https://pwdglktwuquoswqoyely.supabase.co https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://*.sentry.io https://*.ingest.sentry.io; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>Utkio — Quiz</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .wrap{ overflow:hidden; }
  .quiz-progress{ display:flex; gap:5px; margin:10px 2px 4px; }
  .quiz-progress span{ flex:1; height:4px; border-radius:3px; background:var(--line); }
  .quiz-progress span.done{ background:var(--accent); }
  .quiz-progress span.current{ background:var(--accent); opacity:0.5; }

  .score-pill{
    align-self:center; margin:10px auto 2px; font-size:0.78rem; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:4px 14px;
  }

  .qstage{ position:relative; flex:1; min-height:0; margin:12px 2px 6px; touch-action:none; }
  .qcard{
    position:absolute; inset:0; border-radius:24px; padding:26px 22px;
    box-shadow:0 16px 34px -18px rgba(40,30,80,0.35);
    display:flex; flex-direction:column; will-change:transform;
    -webkit-user-select:none; user-select:none; touch-action:none;
    transition:transform 0.32s cubic-bezier(.22,.9,.32,1), opacity 0.32s;
  }
  .qcard.dragging{ transition:none; }
  .qc-0{ background:linear-gradient(155deg,#FFE8D6,#FFF3E9); color:#7A3B18; }
  .qc-1{ background:linear-gradient(155deg,#DCEEFB,#EFF8FF); color:#1D5B8C; }
  .qc-2{ background:linear-gradient(155deg,#E3F5DE,#F2FBEF); color:#2E7D42; }
  .qc-3{ background:linear-gradient(155deg,#FBE4F0,#FFF1F8); color:#B23E77; }

  .q-prompt{ font-size:0.8rem; font-weight:700; opacity:0.75; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:10px; }
  .q-hindi{ font-size:1.2rem; font-weight:700; margin-bottom:6px; }
  .q-sentence{ font-size:1.15rem; font-weight:700; line-height:1.5; margin:auto 0; text-align:center; }
  .q-body{ flex:1; display:flex; flex-direction:column; justify-content:center; }

  .yn-hint{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; font-size:0.8rem; font-weight:700; opacity:0.8; }
  .yn-hint .no{ color:#c0392b; } .yn-hint .yes{ color:#1e7a3d; }

  .opt-list{ margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .opt-btn{
    font-family:inherit; text-align:left; font-size:0.95rem; font-weight:600; padding:13px 16px;
    border-radius:14px; border:none; background:rgba(255,255,255,0.65); color:inherit; cursor:pointer;
  }
  .opt-btn.correct{ background:#c9f0d6 !important; color:#1e7a3d !important; }
  .opt-btn.wrong{ background:#f8d0cd !important; color:#a4291f !important; }

  .mic-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:auto; }
  .mic-round{
    width:78px; height:78px; border-radius:50%; border:none; background:rgba(255,255,255,0.75);
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 20px -10px rgba(0,0,0,0.3);
  }
  .mic-round svg{ width:30px; height:30px; }
  .mic-round.rec{ background:#e0575c; animation:pulse 1s infinite; }
  .mic-round.rec svg{ color:#fff; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,87,92,0.5);} 50%{ box-shadow:0 0 0 14px rgba(224,87,92,0);} }
  .mic-status{ font-size:0.82rem; font-weight:600; opacity:0.85; text-align:center; }
  .skip-link{ font-size:0.78rem; text-decoration:underline; opacity:0.7; background:none; border:none; cursor:pointer; color:inherit; font-family:inherit; }

  .feedback-overlay{
    position:absolute; inset:0; border-radius:24px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:1.1rem;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .feedback-overlay.show{ opacity:1; }
  .feedback-overlay.ok{ background:rgba(46,158,91,0.92); color:#fff; }
  .feedback-overlay.bad{ background:rgba(224,87,92,0.92); color:#fff; }
  .feedback-overlay .sub{ font-size:0.82rem; font-weight:600; opacity:0.92; padding:0 24px; text-align:center; }

  /* ---- Result screen ---- */
  .result-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; }
  .result-emoji{ font-size:2.6rem; }
  .result-score{ font-size:2.4rem; font-weight:800; color:var(--accent); }
  .result-sub{ color:var(--ink-dim); font-size:0.9rem; margin-bottom:18px; }
  .result-actions{ width:100%; max-width:280px; display:flex; flex-direction:column; gap:10px; }

  .qempty{ text-align:center; padding:60px 20px; color:var(--ink-dim); font-size:0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="icon-btn" id="backBtn" href="history.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="app-title" style="font-size:1.2rem;">Quick Quiz</h1>
    <span style="width:38px;"></span>
  </header>

  <div class="quiz-progress" id="progressBar"></div>
  <div id="content" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
</div>

<script type="module">
import { GoogleGenAI } from "./vendor/google-genai.bundle.mjs";
import './shared/config.js';
import { requireAuthOrRedirect, apiFetch } from './shared/auth.js';
import { requireActivePlan } from './shared/plan.js';
import { initBackNav } from './shared/back-nav.js';
import { checkGeminiApiKey } from './shared/gemini-key-check.js';
import { getApiKey, getMicCapturePluginOrNull } from './shared/mic-helpers.js';
import { escapeHtml } from './shared/sanitize.js';

await requireAuthOrRedirect();
await requireActivePlan(); // see shared/plan.js — UX nicety, backend is the real gate

const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session');
initBackNav('report.html?session=' + encodeURIComponent(sessionId || ''));

const content = document.getElementById('content');
const progressBar = document.getElementById('progressBar');

let questions = [];
let qIndex = 0;
let correctCount = 0;
let attemptedCount = 0;

// getApiKey() comes from shared/mic-helpers.js — same key, same read
// logic as chat.html, no longer duplicated here.

// Checked once per quiz (not per question) and cached — only 'speak'
// questions actually need the Gemini key, so this only fires if the quiz
// has at least one of those (see init() below).
// Cached across all 'speak' questions in a quiz — the key is checked
// once, not once per question. IMPORTANT: only a REAL verdict (valid /
// invalid / quota_exceeded) gets cached. A network_error (device was
// offline at the moment of this check) is deliberately NOT cached —
// caching it would permanently disable the mic for the rest of the
// quiz with a wrong "go to Settings" message, even after the user's
// internet comes back. Leaving it uncached means the very next 'speak'
// question calls this again and gets a fresh, accurate answer.
let keyStatusPromise = null;
async function ensureKeyChecked(){
  if (keyStatusPromise) return keyStatusPromise;
  const attempt = (async () => {
    const { isOnline } = await import('./shared/network-status.js');
    if (!(await isOnline())) {
      return { status: 'network_error', message: 'Internet connection nahi hai — check karke phir try karo.' };
    }
    return checkGeminiApiKey(await getApiKey());
  })();
  keyStatusPromise = attempt;
  const result = await attempt;
  if (result.status === 'network_error') keyStatusPromise = null; // don't persist a transient offline verdict
  return result;
}

function renderProgress(){
  progressBar.innerHTML = questions.map((_, i) => {
    const cls = i < qIndex ? 'done' : (i === qIndex ? 'current' : '');
    return `<span class="${cls}"></span>`;
  }).join('');
}

function cardColorClass(i){ return 'qc-' + (i % 4); }

// ---- Card scaffolding shared by all question types ----
function renderQuestionShell(innerHtml, colorClass){
  content.innerHTML = `
    <div class="score-pill">${correctCount} / ${attemptedCount} sahi abhi tak</div>
    <div class="qstage">
      <div class="qcard ${colorClass}" id="qcard">
        ${innerHtml}
        <div class="feedback-overlay" id="feedback"></div>
      </div>
    </div>
  `;
  renderProgress();
  return document.getElementById('qcard');
}

function showFeedback(isOk, subtext){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback-overlay show ' + (isOk ? 'ok' : 'bad');
  fb.innerHTML = `<div>${isOk ? '✓ Sahi!' : '✗ Thoda aur dhyan do'}</div>${subtext ? `<div class="sub">${subtext}</div>` : ''}`;
}

function nextAfterDelay(delay){
  setTimeout(() => { qIndex += 1; renderCurrentQuestion(); }, delay);
}

// ---- yes_no: swipe right = "sahi hai", swipe left = "galat hai" ----
function renderYesNo(q, colorClass){
  const card = renderQuestionShell(`
    <div class="q-prompt">${escapeHtml(q.prompt || 'Ye sentence sahi hai ya galat?')}</div>
    <div class="q-body"><div class="q-sentence">${escapeHtml(q.sentence)}</div></div>
    <div class="yn-hint"><span class="no">← Galat</span><span class="yes">Sahi →</span></div>
  `, colorClass);

  let startX = 0, dx = 0, dragging = false, resolved = false, pointerId = null;

  function commit(userSaysCorrect){
    if (resolved) return;
    resolved = true;
    const isRight = userSaysCorrect === q.is_correct;
    attemptedCount += 1;
    if (isRight) correctCount += 1;
    card.style.transform = `translateX(${userSaysCorrect ? 500 : -500}px) rotate(${userSaysCorrect ? 25 : -25}deg)`;
    card.style.opacity = '0';
    showFeedback(isRight, isRight ? '' : (q.is_correct ? 'Ye sentence actually sahi thi.' : 'Ye sentence actually galat thi.'));
    nextAfterDelay(950);
  }

  const onDown = (e) => {
    dragging = true; pointerId = e.pointerId;
    card.setPointerCapture(pointerId);
    card.classList.add('dragging');
    startX = e.clientX;
  };
  const onMove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false; card.classList.remove('dragging');
    try { card.releasePointerCapture(pointerId); } catch (e) {}
    if (dx > 90) commit(true);
    else if (dx < -90) commit(false);
    else { card.style.transform = 'translateX(0) rotate(0deg)'; }
    dx = 0;
  };
  card.addEventListener('pointerdown', onDown);
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointercancel', onUp);
}

// ---- choose_3 / hindi_to_english: tap the correct option ----
function renderChoose(q, colorClass, isHindi){
  const card = renderQuestionShell(`
    <div class="q-prompt">${escapeHtml(q.prompt || (isHindi ? 'Sahi English chuno:' : 'Sahi option chuno:'))}</div>
    ${isHindi && q.hindi ? `<div class="q-hindi">${escapeHtml(q.hindi)}</div>` : ''}
    <div class="opt-list" id="optList">
      ${(q.options || []).map((opt, i) => `<button class="opt-btn" data-opt="${i}">${escapeHtml(opt)}</button>`).join('')}
    </div>
  `, colorClass);

  let resolved = false;
  card.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (resolved) return;
      resolved = true;
      const norm = (s) => (s || '').trim().toLowerCase();
      const chosen = btn.textContent;
      const isRight = norm(chosen) === norm(q.correct_option);
      attemptedCount += 1;
      if (isRight) correctCount += 1;
      card.querySelectorAll('.opt-btn').forEach(b => {
        if (norm(b.textContent) === norm(q.correct_option)) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });
      showFeedback(isRight, isRight ? '' : ('Correct answer: ' + escapeHtml(q.correct_option)));
      nextAfterDelay(1100);
    });
  });
}

// ---- speak: record via native mic, ask Gemini to judge ----
// getMicCapturePluginOrNull() comes from shared/mic-helpers.js.

function pcmToWavBase64(pcmBytes, sampleRate, numChannels, bitsPerSample){
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = pcmBytes.length;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true); view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data'); view.setUint32(40, dataSize, true);
  new Uint8Array(buffer, 44).set(pcmBytes);
  const bytes = new Uint8Array(buffer);
  const CHUNK = 0x8000; let binary = '';
  for (let i = 0; i < bytes.length; i += CHUNK) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  return btoa(binary);
}

async function evaluateSpeech(pcmBytes, expected){
  const apiKey = await getApiKey();
  if (!apiKey) throw new Error('no_key');
  const wavBase64 = pcmToWavBase64(pcmBytes, 16000, 1, 16);
  const ai = new GoogleGenAI({ apiKey });
  const response = await ai.models.generateContent({
    model: 'gemini-2.5-flash',
    contents: [{
      role: 'user',
      parts: [
        { inlineData: { mimeType: 'audio/wav', data: wavBase64 } },
        { text: `Ye audio suno. User ko exactly ye bolna tha: "${expected}". Judge karo user ne iske kaafi kareeb sahi English bola ya nahi (thoda uchcharan farak chalega, lekin sentence/grammar sahi hona chahiye). SIRF is JSON format mein reply do, aur kuch mat likho: {"heard":"jo suna wo yahan likho","correct":true}` }
      ]
    }]
  });
  let text = '';
  try { text = response.text || response.candidates[0].content.parts[0].text; } catch (e) { text = String(response); }
  const cleaned = String(text).replace(/```json|```/g, '').trim();
  return JSON.parse(cleaned);
}

function renderSpeak(q, colorClass){
  const card = renderQuestionShell(`
    <div class="q-prompt">${escapeHtml(q.prompt || 'Ye zor se bolo:')}</div>
    ${q.hindi ? `<div class="q-hindi">${escapeHtml(q.hindi)}</div>` : ''}
    <div class="mic-wrap">
      <button class="mic-round" id="micBtn" aria-label="Record">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
      <div class="mic-status" id="micStatus">Tap to speak, tap again to stop</div>
      <button class="skip-link" id="skipBtn">skip</button>
    </div>
  `, colorClass);

  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const skipBtn = document.getElementById('skipBtn');
  let resolved = false;
  let recording = false;
  let listenerHandle = null;
  let chunks = [];

  function finish(isRight, heard){
    if (resolved) return;
    resolved = true;
    attemptedCount += 1;
    if (isRight) correctCount += 1;
    showFeedback(isRight, heard ? ('You said: "' + escapeHtml(heard) + '"') : (isRight ? '' : 'Correct answer: ' + escapeHtml(q.expected_answer)));
    nextAfterDelay(1300);
  }

  function skip(){
    if (resolved) return;
    resolved = true;
    showFeedback(false, 'Skip kar diya — sahi jawab: ' + escapeHtml(q.expected_answer));
    nextAfterDelay(1300);
  }
  skipBtn.addEventListener('click', skip);

  const MicCapture = getMicCapturePluginOrNull();
  if (!MicCapture){
    micStatus.textContent = 'Microphone recording is not available on this device — skipping.';
    micBtn.disabled = true;
    setTimeout(skip, 1200);
    return;
  }

  // Cached across all 'speak' questions in this quiz (see
  // ensureKeyChecked()) — fires once, not once per question.
  ensureKeyChecked().then((keyStatus) => {
    if (resolved) return; // user already moved past this question by the time this resolves
    if (keyStatus.status === 'network_error') {
      micStatus.textContent = keyStatus.message; // "Internet connection nahi hai..." — no Settings redirect, nothing wrong with the key
      micBtn.disabled = true;
    } else if (keyStatus.status !== 'valid') {
      micStatus.textContent = (keyStatus.message || 'Invalid API key') + ' — Go to Settings to fix this, then come back.';
      micBtn.disabled = true;
    }
  });

  micBtn.addEventListener('click', async () => {
    if (resolved) return;
    if (!recording){
      chunks = [];
      try{
        listenerHandle = await MicCapture.addListener('audioChunk', (data) => {
          if (!data || !data.audio) return;
          const binary = atob(data.audio);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          chunks.push(bytes);
        });
        await MicCapture.start();
        recording = true;
        micBtn.classList.add('rec');
        micStatus.textContent = 'Listening… tap again when done';
      }catch(e){
        micStatus.textContent = 'Could not start mic: ' + (e.message || e);
      }
    } else {
      recording = false;
      micBtn.classList.remove('rec');
      micStatus.textContent = 'Checking…';
      try{ await MicCapture.stop(); }catch(e){}
      if (listenerHandle){ try{ await listenerHandle.remove(); }catch(e){} listenerHandle = null; }

      const total = chunks.reduce((n, c) => n + c.length, 0);
      if (total === 0){ micStatus.textContent = 'Nothing was heard — please try again.'; return; }
      const merged = new Uint8Array(total);
      let off = 0; for (const c of chunks){ merged.set(c, off); off += c.length; }

      try{
        const result = await evaluateSpeech(merged, q.expected_answer);
        finish(!!result.correct, result.heard);
      }catch(e){
        console.error('speech eval failed', e);
        // Check connectivity FIRST — before spending another network
        // round-trip on checkGeminiApiKey(). Same reasoning as
        // chat.html/scenario.html: checking the key AFTER an offline
        // failure used to mean the key-check's own fetch() also failed
        // (network_error), which read as "invalid key" and told the
        // user to go fix their Settings — when nothing was wrong with
        // their key at all.
        const { isOnline } = await import('./shared/network-status.js');
        if (!(await isOnline())){
          micStatus.textContent = 'Internet connection nahi hai — check karke phir try karo.';
          micBtn.disabled = true;
          return; // don't auto-skip — let them see the real reason and retry once back online
        }
        const keyStatus = await checkGeminiApiKey(await getApiKey());
        if (keyStatus.status !== 'valid') {
          micStatus.textContent = (keyStatus.message || 'Invalid API key') + ' — Go to Settings to fix this.';
          micBtn.disabled = true;
          return; // don't auto-skip — the person needs to see the real reason, not just watch it move on
        }
        micStatus.textContent = 'Could not check your answer — skipping.';
        setTimeout(skip, 800);
      }
    }
  });
}

function renderCurrentQuestion(){
  if (qIndex >= questions.length){ renderResult(); return; }
  const q = questions[qIndex];
  const colorClass = cardColorClass(qIndex);
  if (q.type === 'yes_no') renderYesNo(q, colorClass);
  else if (q.type === 'choose_3') renderChoose(q, colorClass, false);
  else if (q.type === 'hindi_to_english') renderChoose(q, colorClass, true);
  else if (q.type === 'speak') renderSpeak(q, colorClass);
  else { qIndex += 1; renderCurrentQuestion(); }
}

function renderResult(){
  progressBar.innerHTML = questions.map(() => `<span class="done"></span>`).join('');
  const pct = attemptedCount ? Math.round((correctCount / attemptedCount) * 100) : 0;
  const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '🌱';
  content.innerHTML = `
    <div class="result-wrap">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${correctCount} / ${attemptedCount}</div>
      <div class="result-sub">is quiz mein sahi — bahut badhiya practice hui!</div>
      <div class="result-actions">
        <button class="primary" id="shareBtn">Score share karo</button>
        <button class="secondary" id="doneBtn">Report pe wapas jao</button>
      </div>
    </div>
  `;
  document.getElementById('doneBtn').addEventListener('click', () => {
    window.location.href = 'report.html?session=' + encodeURIComponent(sessionId || '');
  });
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const text = `🎯 Utkio pe abhi English practice ki — quiz mein ${correctCount}/${attemptedCount} sahi! Bolke seekh raha hu, roz thoda behtar. 🇮🇳➡️🌍`;
    if (navigator.share){
      try{ await navigator.share({ text }); }catch(e){ /* user cancelled, ignore */ }
    } else {
      try{ await navigator.clipboard.writeText(text); alert('Copy ho gaya — WhatsApp pe paste kar do!'); }
      catch(e){ alert(text); }
    }
  });
}

async function init(){
  if (!sessionId){
    content.innerHTML = '<div class="qempty">Session ID missing.</div>';
    return;
  }
  try{
    const data = await apiFetch('/chat/sessions/' + sessionId + '/report');
    questions = Array.isArray(data.report.quiz) ? data.report.quiz : [];
    if (!questions.length){
      content.innerHTML = '<div class="qempty">Is report ke liye quiz available nahi hai. Purani reports mein quiz nahi hota — nayi session try karo.</div>';
      return;
    }
    renderCurrentQuestion();
  }catch(e){
    content.innerHTML = '<div class="qempty">Could not load the quiz: ' + escapeHtml(e.message || 'try again') + '</div>';
  }
}

init();
</script>
</body>
</html>
