<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Utkio — Let's get started</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap" style="justify-content:center;">
  <div class="progress-dots" id="progressDots" aria-hidden="true"></div>
  <div class="sr-only" id="stepAnnounce" aria-live="polite"></div>

  <div class="card">
    <div id="stepBody"></div>

    <div class="status-msg err" id="statusMsg" role="alert" aria-live="assertive"></div>

    <div class="step-nav">
      <button class="secondary" id="backBtn" style="display:none;">Back</button>
      <button class="primary" id="nextBtn">Next</button>
    </div>
  </div>
</div>

<script type="module">
import './shared/config.js';
import { requireAuthOrRedirect, apiFetch } from './shared/auth.js';
import { initBackNav } from './shared/back-nav.js';

// Just needs a logged-in session — this page itself doesn't require
// onboarding to already be complete (that would be circular).
await requireAuthOrRedirect();
initBackNav(null, true); // mandatory — back button is disabled here

const answers = {
  name: '', age: '', occupation_type: '', class_grade: '', profession: '', city: '',
  goal: '', self_level: '', english_sample: '', daily_time: ''
};

const OCCUPATION_OPTIONS = [
  { value: 'student', label: "I'm a student" },
  { value: 'professional', label: "I'm a working professional" }
];

const GOAL_OPTIONS = [
  { value: 'interview', label: 'Job interview / professional English' },
  { value: 'daily_confidence', label: 'Everyday confidence — talking in English with friends/family' },
  { value: 'exam_prep', label: 'Exam prep (IELTS / TOEFL / etc.)' },
  { value: 'travel', label: 'Travel — talking with foreigners' },
  { value: 'content_creation', label: 'Content creation / social media' },
  { value: 'general', label: 'Just general improvement' }
];

const LEVEL_OPTIONS = [
  { value: 'beginner', label: 'Beginner — starting from the basics' },
  { value: 'intermediate', label: "Intermediate — I can speak a bit, not fluent" },
  { value: 'advanced', label: "Advanced — I'm quite comfortable, just want to polish it" }
];

const TIME_OPTIONS = [
  { value: '5_10', label: '5–10 minutes daily' },
  { value: '15_20', label: '15–20 minutes daily' },
  { value: '30_plus', label: '30+ minutes daily' }
];

// A short, natural, home-related Hindi sentence at an intermediate
// difficulty — used by the translation step below instead of a blank
// "write about yourself" box.
const HINDI_TRANSLATE_PROMPT = 'हमारे घर में हर रविवार को सब लोग मिलकर खाना बनाते हैं और शाम को साथ बैठकर बातें करते हैं।';

// Each step: render(container) fills the step's OWN content into `container`
// (a dedicated inner div — never the title/sub area, see renderStep()).
// validate() returns true/error-string. optional:true steps show a "Skip"
// button instead of "Next" while empty, and never block progress.
const steps = [
  {
    title: 'Enter your name',
    sub: 'So Utkio can talk to you personally, not like a stranger.',
    render(el){
      el.innerHTML = `<input type="text" id="f_name" placeholder="e.g. Ayush" autocomplete="name" maxlength="100">`;
      el.querySelector('#f_name').value = answers.name;
      el.querySelector('#f_name').addEventListener('input', e => answers.name = e.target.value);
    },
    validate(){ return answers.name.trim() ? true : 'Please enter your name 🙂'; }
  },
  {
    title: 'Enter your age',
    sub: 'This helps Utkio pick examples and topics that actually fit your life — numbers only.',
    render(el){
      el.innerHTML = `<input type="text" inputmode="numeric" id="f_age" placeholder="e.g. 22">`;
      el.querySelector('#f_age').value = answers.age;
      el.querySelector('#f_age').addEventListener('input', e => {
        answers.age = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = answers.age;
      });
    },
    validate(){
      const n = Number(answers.age);
      if (!answers.age || !Number.isInteger(n) || n < 5 || n > 100) return 'Please enter a valid age (between 5-100).';
      return true;
    }
  },


  {
    title: 'Are you a student or a working professional?',
    sub: 'This shapes the kind of conversations and vocabulary Utkio practices with you.',
    render(el){
      el.innerHTML = `<div class="chip-group" id="f_occ"></div>`;
      renderChips(el.querySelector('#f_occ'), OCCUPATION_OPTIONS, 'occupation_type');
    },
    validate(){ return answers.occupation_type ? true : 'Choose one'; }
  },
  {
    // Content of this step depends on the previous answer — computed at render time.
    title(){ return answers.occupation_type === 'student' ? 'Which class/course are you in?' : 'What is your profession/role?'; },
    sub(){ return answers.occupation_type === 'student' ? 'e.g. "Class 10", "B.Tech 2nd year" — already graduated or not studying right now? Use the link below.' : 'e.g. "Software Engineer", "Teacher"'; },
    render(el){
      const isStudent = answers.occupation_type === 'student';
      const key = isStudent ? 'class_grade' : 'profession';
      const placeholder = isStudent ? 'e.g. Class 10, B.Tech 2nd year, or "Passed out"' : 'e.g. Software Engineer';
      el.innerHTML = `
        <input type="text" id="f_occdetail" placeholder="${placeholder}" maxlength="150">
        <button type="button" id="occSwitchLink" style="background:none;border:none;padding:8px 0 0;margin:0;color:var(--accent);font-size:0.85rem;font-weight:600;text-align:left;cursor:pointer;text-decoration:underline;">
          ${isStudent ? "Already graduated / doing something else? Tap here" : "Actually, I'm currently a student — tap here"}
        </button>`;
      el.querySelector('#f_occdetail').value = answers[key];
      el.querySelector('#f_occdetail').addEventListener('input', e => answers[key] = e.target.value);
      el.querySelector('#occSwitchLink').addEventListener('click', () => {
        answers.occupation_type = isStudent ? 'professional' : 'student';
        renderStep(); // re-render this same step with the flipped type
      });
    },
    validate(){
      const key = answers.occupation_type === 'student' ? 'class_grade' : 'profession';
      return answers[key] && answers[key].trim() ? true : 'Please fill this field.';
    }
  },
  {
    title: 'Which city do you live in?',
    sub: 'Helps Utkio relate examples to places and things you know.',
    optional: true,
    optionalKey: 'city',
    render(el){
      el.innerHTML = `<input type="text" id="f_city" placeholder="e.g. Patna" maxlength="100">`;
      el.querySelector('#f_city').value = answers.city;
      el.querySelector('#f_city').addEventListener('input', e => { answers.city = e.target.value; refreshNextLabel(); });
    },
    validate(){ return true; } // optional
  },
  {
    title: 'Why do you want to improve your English?',
    sub: 'This will help Utkio know which topics are most useful for you.',
    render(el){
      el.innerHTML = `<div class="chip-group" id="f_goal"></div>`;
      renderChips(el.querySelector('#f_goal'), GOAL_OPTIONS, 'goal');
    },
    validate(){ return answers.goal ? true : 'Please choose an option.'; }
  },
  {
    title: 'What is your current English level?',
    sub: "Choose whichever feels most accurate — there's no wrong answer.",
    render(el){
      el.innerHTML = `<div class="chip-group" id="f_level"></div>`;
      renderChips(el.querySelector('#f_level'), LEVEL_OPTIONS, 'self_level');
    },
    validate(){ return answers.self_level ? true : 'Please choose an option.'; }
  },
  {
    title: 'Translate this into English',
    sub: `(Optional) "${HINDI_TRANSLATE_PROMPT}" — try it in your own words, whatever you know. No grading, just for the record.`,
    optional: true,
    optionalKey: 'english_sample',
    render(el){
      el.innerHTML = `
        <textarea id="f_sample" placeholder="Type your English translation here..." maxlength="500"></textarea>
        <div class="char-hint" id="charHint">0 / 500</div>`;
      const ta = el.querySelector('#f_sample');
      ta.value = answers.english_sample;
      el.querySelector('#charHint').textContent = ta.value.length + ' / 500';
      ta.addEventListener('input', e => {
        answers.english_sample = e.target.value;
        el.querySelector('#charHint').textContent = e.target.value.length + ' / 500';
        refreshNextLabel();
      });
    },
    validate(){ return true; } // optional
  },
  {
    title: 'How much time can you spare daily for practice?',
    sub: 'This will give us an idea of how long the sessions should be.',
    render(el){
      el.innerHTML = `<div class="chip-group" id="f_time"></div>`;
      renderChips(el.querySelector('#f_time'), TIME_OPTIONS, 'daily_time');
    },
    validate(){ return answers.daily_time ? true : 'Please choose an option.'; }
  }
];

// For optional steps, is there anything actually entered yet? Used to
// decide whether the primary button reads "Skip" or "Next".
function stepHasValue(step){
  if (!step.optional) return true;
  return !!(answers[step.optionalKey] && answers[step.optionalKey].trim());
}

function renderChips(container, options, key){
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (answers[key] === opt.value ? ' selected' : '');
    btn.textContent = opt.label;
    btn.setAttribute('aria-pressed', String(answers[key] === opt.value));
    btn.addEventListener('click', () => {
      answers[key] = opt.value;
      container.querySelectorAll('.chip').forEach(c => { c.classList.remove('selected'); c.setAttribute('aria-pressed', 'false'); });
      btn.classList.add('selected');
      btn.setAttribute('aria-pressed', 'true');
    });
    container.appendChild(btn);
  });
}

let current = 0;
const stepBody = document.getElementById('stepBody');
const statusMsg = document.getElementById('statusMsg');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const progressDots = document.getElementById('progressDots');
const stepAnnounce = document.getElementById('stepAnnounce');

function renderDots(){
  progressDots.innerHTML = '';
  steps.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i < current) dot.className = 'done';
    else if (i === current) dot.className = 'active';
    progressDots.appendChild(dot);
  });
}

function renderStep(){
  statusMsg.textContent = '';
  const step = steps[current];
  const title = typeof step.title === 'function' ? step.title() : step.title;
  const sub = typeof step.sub === 'function' ? step.sub() : step.sub;
  // BUG FIX: previously step.render(stepBody) was passed the SAME element
  // that the title/sub were just written into, and every step's render()
  // does `el.innerHTML = ...`, which wiped the title/sub out immediately
  // (that's why the heading/instructions never appeared on screen — only
  // the bare input/chips were left). Each step now gets its own inner
  // #stepContent div to write into, so the title/sub stay intact.
  stepBody.innerHTML = `<div class="step-title" id="stepTitleText">${title}</div><div class="step-sub">${sub}</div><div id="stepContent"></div>`;
  const stepContent = stepBody.querySelector('#stepContent');
  step.render(stepContent);
  // Associate the step's primary input with its (dynamically rendered)
  // visual title, since these steps don't use static <label for> markup —
  // one generic hook here covers every step instead of touching each
  // render() function individually.
  const control = stepContent.querySelector('input, textarea');
  if (control && !control.hasAttribute('aria-label')) {
    control.setAttribute('aria-labelledby', 'stepTitleText');
  }
  backBtn.style.display = current === 0 ? 'none' : '';
  refreshNextLabel();
  renderDots();
  stepAnnounce.textContent = `Step ${current + 1} of ${steps.length}`;
}

// Keeps the primary button's label in sync: "Get Started" on the final
// step, "Skip" on an untouched optional step, "Next" otherwise. Called on
// every render AND on every keystroke in an optional field, so the label
// flips from "Skip" to "Next" the moment the user starts typing.
function refreshNextLabel(){
  const step = steps[current];
  nextBtn.textContent = current === steps.length - 1
    ? 'Get Started'
    : (step.optional && !stepHasValue(step) ? 'Skip' : 'Next');
}

backBtn.addEventListener('click', () => {
  if (current > 0){ current--; renderStep(); }
});

nextBtn.addEventListener('click', async () => {
  const result = steps[current].validate();
  if (result !== true){
    statusMsg.textContent = result;
    return;
  }

  if (current < steps.length - 1){
    current++;
    renderStep();
    return;
  }

  // Last step — submit everything.
  nextBtn.disabled = true;
  backBtn.disabled = true;
  statusMsg.className = 'status-msg';
  statusMsg.textContent = 'Saving...';

  try {
    await apiFetch('/users/onboarding', {
      method: 'POST',
      body: JSON.stringify(answers)
    });
    window.location.href = 'chat.html';
  } catch (err) {
    statusMsg.className = 'status-msg err';
    statusMsg.textContent = err.message || 'Something went wrong, please try again.';
    nextBtn.disabled = false;
    backBtn.disabled = false;
  }
});

renderStep();
</script>
</body>
</html>
