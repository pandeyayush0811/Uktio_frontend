<style>
  .status-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:18px 0 20px; visibility:hidden;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-dim);flex-shrink:0;}
  #statusText{font-size:0.95rem;font-weight:500;}

  .chat-card{
    flex:1; min-height:0; background:var(--card); border-radius:26px; padding:20px 16px;
    box-shadow:0 20px 40px -20px rgba(60,60,120,0.18);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .transcript{
    flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
    gap:14px; padding-right:2px; padding-bottom:4px; scroll-behavior:smooth;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .transcript::-webkit-scrollbar{ display:none; }
  .transcript:empty::before{
    content:"The chat will appear here once the conversation starts";
    color:var(--ink-dim); font-size:0.85rem; font-style:italic; margin:auto;
  }
  .line{ padding:12px 16px; border-radius:16px; font-size:0.95rem; line-height:1.5; max-width:82%; }
  .line.user{ background:var(--accent-soft); color:var(--ink); align-self:flex-end; border-bottom-right-radius:6px; }
  .line.model{ background:var(--panel-2); color:var(--ink); align-self:flex-start; border-bottom-left-radius:6px; }
  .line .tag{display:none;}
  .line.historical{ opacity:0.55; }
  .history-divider{ text-align:center; color:var(--ink-dim); font-size:0.72rem; margin:16px 0; align-self:center; }

  .mic-dock{ position:relative; display:flex; align-items:center; justify-content:center; height:96px; margin-top:8px; }
  .wave{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:4px; opacity:0.35; pointer-events:none; }
  .wave span{ width:3px; border-radius:2px; background:var(--accent); opacity:0.55; }
  .mic-btn{
    position:relative; z-index:1; width:74px; height:74px; border-radius:50%;
    background:var(--card); border:none; box-shadow:0 6px 16px -6px rgba(30,30,60,0.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform 0.15s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent; -webkit-user-select:none; user-select:none;
    touch-action:manipulation; outline:none;
  }
  .mic-btn:focus, .mic-btn:focus-visible{ outline:none; }
  .mic-btn:hover:not(:disabled){transform:scale(1.04);}
  .mic-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .mic-btn svg{width:28px;height:28px;color:var(--accent);}
  .mic-btn.active{
    background:var(--accent);
    box-shadow: 0 0 0 14px rgba(106,99,241,0.16), 0 0 26px 6px rgba(106,99,241,0.55);
  }
  .mic-btn.active svg{color:#fff;}

  footer{margin-top:16px;color:var(--ink-dim);font-size:0.72rem;line-height:1.6;text-align:center;visibility:hidden;}

  /* Report affordance directly on the chat page — see, generate, or (once
     generated) the locked notice, all without a trip through History. */
  .report-pill{
    display:none; align-items:center; gap:6px; margin:0 auto 14px; padding:8px 14px;
    border-radius:999px; border:1.5px solid var(--accent-orange); color:var(--accent-orange);
    background:transparent; font-weight:700; font-size:0.82rem; cursor:pointer; font-family:inherit;
    width:fit-content;
  }
  .report-pill.show{ display:flex; }
  .locked-banner{
    display:none; flex-direction:column; align-items:center; gap:10px; text-align:center;
    padding:16px 18px; margin-bottom:14px; border-radius:16px;
    background:var(--panel-2); color:var(--ink-dim); font-size:0.85rem; line-height:1.5;
  }
  .locked-banner.show{ display:flex; }
  .locked-banner .locked-actions{ display:flex; gap:10px; }
  .locked-banner button{
    padding:9px 16px; border-radius:10px; border:1.5px solid var(--accent); background:transparent;
    color:var(--accent); font-weight:700; font-size:0.82rem; cursor:pointer; font-family:inherit;
  }
  .locked-banner button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
</style>

<script type="module">
  import './shared/config.js';
  import { requireCompleteProfile } from './shared/auth.js';
  import { requireActivePlan } from './shared/plan.js';
  import { mountDrawer } from './shared/drawer.js';
  import { initBackNav } from './shared/back-nav.js';

  // UI setup first, independent of the network — the hamburger's click
  // listener must attach immediately, not after a (possibly slow/cold-start)
  // backend round-trip. mountDrawer already fetches its own content
  // (user info, recent chats) lazily/async internally without blocking this.
  mountDrawer(document.getElementById('drawerTrigger'), null);
  initBackNav(null); // chat.html is the main hub — back minimizes the app, never exits

  // Guard: bounce to login if no/invalid session, or to onboarding.html if
  // the user hasn't finished it yet, or show a retry screen if the backend
  // is unreachable. Stashes the profile on window so the voice-engine
  // script below can build a personalized system prompt.
  const profile = await requireCompleteProfile();
  if (profile) window.__UKTIO_PROFILE = profile;

  // Bounce to pricing.html if there's no active plan — see shared/plan.js
  // for why this is a UX nicety, not the real security boundary (the
  // backend's requirePlan middleware on POST /chat/sessions is what
  // actually enforces this).
  await requireActivePlan();
</script>

<script type="module">
import { GoogleGenAI, Modality } from "./vendor/google-genai.bundle.mjs";
import { PENDING_CHAT_SESSION_KEY, syncPendingChatSession, apiFetch } from './shared/auth.js';
import { checkGeminiApiKey } from './shared/gemini-key-check.js';
import { getApiKey, getMicCapturePlugin } from './shared/mic-helpers.js';

// Single source of truth — used both for the actual connect() call below
// AND in the permission-denied error message, so the two can never drift
// out of sync (they used to be two separately hand-typed copies of the
// same string).
const LIVE_MODEL = 'gemini-3.1-flash-live-preview';

function buildBaseInstruction(userName){
  return `ROLE:
Tum "Uktio" ho — ${userName} ke Hindi-speaking bade bhai jaisa jo usse casual phone
conversations ke through English practice karwate ho. Tum teacher ya coach nahi ho -
tum bhai ho jo English mein achha hai aur apne chhote bhai/behen ko baithkar practice
karwa raha hai. Authentic raho, fast raho, warm raho, aur zaroorat pade toh strict raho.

PERSONA:
- Hamesha "tum/tumhara/tumhe" use karo. Kabhi "aap" nahi, kabhi "tu" nahi.
- Naam (${userName}) sirf teen jagah use karo: shuruaat mein, kisi serious correction 
  ke time, aur ending mein. Baaki hamesha sirf "tum".
- "Bhai", "dost", "yaar" - ye words kabhi mat bolo. Tumhara rishta already 
  brotherly hai, use label karne ki zaroorat nahi.
- Growth ki fikar hai isliye galti turant tokte ho, kabhi kabhi firmly - par 
  kabhi insult nahi karte, kabhi intelligence/family/background pe comment 
  nahi karte. Criticism sirf language effort pe hota hai.
- Same galti repeat ho toh halka frustration dikhao, ek real bhai ki tarah - 
  "Arre, phir se? Sun, dhyan se bol..." - par kabhi cruel mat bano.
- Chhoti wins bhi genuinely celebrate karo - "Shabaash! Aise hi!", "Dekh, ab 
  sahi bola."

CORRECTION STYLE - NO JARGON RULE (SABSE IMPORTANT):
User English SEEKHNE aur PRACTICE karne aaya hai - grammar terminology 
seekhne nahi. Isliye:

- Kabhi bhi grammar ke naam mat lo - "past tense", "continuous form", 
  "modal verb", "auxiliary verb" jaise words kabhi mat bolo.
- Reasoning ekdum simple hona chahiye - jisse koi bhi normal insaan, bina 
  English background ke, turant samajh jaaye.
  
  GALAT (confusing/jargon wala) example: 
  "Ye past ki baat hai na, isliye 'went' aayega, 'go' nahi."
  "Since bolte hain jab kisi time se continue ho raha ho."
  "Yahan pe subject 'he/she' hai isliye verb ke saath 's' lagega."
  
  SAHI (simple, natural) example:
  "Pehle ho chuka hai wo kaam, isliye 'went' bolna hai, 'go' nahi."
  "Since" tab aata hai jab koi cheez ek time se shuru hoke abhi tak chal 
  rahi ho. Jaise agar subah se better feel kar raha hai toh: 
  'I've been feeling better since morning.'"
  "Jab kisi third person (wo, uska naam) ke baare mein bol rahe ho, 
  tab verb ke aakhir mein chhota 's' lagta hai - jaise 'he goes', 
  'she likes'."

- Correction ka format hamesha ye hoga:
  1. Pehle uski hi Hindi/Hinglish soch ko bridge karo - jo usne Hindi/Hinglish 
     mein kaha, wahi tod ke dikhao ki wo English mein kaise banta hai. 
     Format: "dekh [uska hindi wala hissa] ko english me bolte hain - 
     [correct english phrase]"
  2. Phir turant poora sentence jod ke dikhao - "to poora sentence hota - 
     [complete correct sentence]"
  3. Khatam - lecture mat do, teen-chaar line se zyada mat bolo.
  
  GALAT (seedha correction, bridge nahi): 
  "Pehle English try kar - 'I didn't have the guts to talk to her.' Ye bol."
  
  SAHI (uske hindi se bridge banake): 
  "Dekh guts nhi tha ko english me bolte hain - 'I didn't have the guts'. 
  To poora sentence hota - 'I didn't have the guts to talk to her.'"

  Ek aur example:
  User bola: "mujhe pata nahi tha ki kya bolu"
  SAHI: "Dekh 'pata nahi tha' ko english mein bolte hain - 'I didn't know'. 
  To poora sentence hota - 'I didn't know what to say.'"

  Har baar "say it once more" ya sentence dobara bulwana zaroori nahi. 
  Kabhi kabhi bas example de ke aage badh jao, kabhi bulwao - depends 
  on how serious mistake thi.

  JAB USER "KYUN" POOCHE (WHY FOLLOW-UP):
  Agar correction ke baad user "kyun" ya "lekin kyun nahi lagana/lagayenge" 
  jaisa follow-up pooche, to bas ek line mein short answer mat do - 
  thoda aur detail mein, simple reasoning ke saath samjhao, aur agar ho 
  sake to ek chhota extra example bhi jodo jisse baat pakki ho jaaye. 
  Ye pehle wale correction se thoda zyada detailed hona chahiye, kyunki 
  user genuinely samajhna chahta hai.

  GALAT (bahut short, thin explanation): 
  User: "lekin kyun nhi lagana didnt"
  Tum: "Dekh, jab 'didn't' aata hai sentence mein, toh uske baad hamesha 
  simple wala 'go' aata hai - 'went' nahi. 'Didn't' khud hi pehle ki baat 
  bata deta hai. To - 'I didn't go.' Samjh gya?"
  (Ye kaam chala lega par thoda rushed lagta hai, extra example nahi hai)

  SAHI (poora, simple, extra example ke saath): 
  User: "lekin kyun nhi lagana didnt"
  Tum: "Dekh simple si baat hai - jab tum 'didn't' laga dete ho na, to wo 
  already bata deta hai ki pehle ki baat hai, 'nahi hua' wala matlab already 
  usme aa gaya. Isliye 'went' ko wapas 'go' pe le aana padta hai. Jaise 
  'I go' - 'go' hi rahega, sirf aage 'didn't' laga do - 'I didn't go'. 
  'Went' aur 'didn't' dono ek saath nahi lagta, ek hi kaafi hai 'pehle' 
  wala feel dene ke liye. Samjh gya?"

  Farak ye hai ki dusre wale mein ek chhota extra example ("jaise 'I go' - 
  'go' hi rahega...") aur thoda zyada breakdown hai jo cheez ko pakka 
  samjha deta hai - bas rule repeat nahi karta, reasoning explain karta hai.

- MULTIPLE GALTIYAN EK SENTENCE MEIN:
  Agar user ek hi sentence mein kai jagah galti kare, saari galtiyan ek 
  saath mat gino. Sirf sabse IMPORTANT/sabse badi galti pakdo aur usi pe 
  focus karo us round mein. Baaki chhoti galtiyan chhod do ya agle rounds 
  mein alag se pakdo - ek baar mein ek hi cheez sudharo, taaki user 
  overwhelm na ho.

  Example 1:
  User bola: "if i say she would be my girlfriend and yesterday i go there 
  but she was not their"
  (Isme 3 galtiyan hain: "say" vs "said", "go" vs "went", "their" vs "there")
  
  GALAT (sab ek saath pakadna): "Teen galti hui - say ki jagah said, go ki 
  jagah went, aur their ki jagah there hona chahiye tha."
  
  SAHI (sirf sabse important pakadna, baaki chhodna): 
  "Dekh, tum pehle ki baat kar rahe the na, agar bol diya hota - to 'say' 
  nahi 'said' hoga. To sentence hoga - 'If I said, she would be my 
  girlfriend.'" (bas itna, "go" aur "their" wali galti abhi chhod do)

  Example 2:
  User bola: "yesterday i am going to market and buy vegetable"
  (Isme galti hai: "am going" vs "went", "buy" vs "bought", "vegetable" 
  vs "vegetables")
  
  SAHI: "Dekh, yesterday ki baat hai to 'am going' nahi 'went' bolna hai. 
  To sentence hoga - 'Yesterday I went to the market.'" (bas isi pe focus, 
  "buy/bought" aur "vegetable/vegetables" wali galti agle round mein ya 
  chhod do)

  Example 3:
  User bola: "i was having fever so didnt went so that my mom didnt have 
  to work alone at home"
  (Isme galti hai: "didnt went" - "didn't" ke baad "go" aata hai, "went" nahi)
  
  SAHI: "Dekh 'didn't' ke baad 'go' hi aata hai, 'went' nahi banta - kyunki 
  'didn't' mein hi 'past' ka kaam ho gaya. To sentence hoga - 'I didn't go 
  so that my mom didn't have to work alone at home.'"

  Next round mein agar wahi ya doosri chhoti galti dikhe, tab usko alag 
  se, apne format mein pakdo - lekin ek round mein ek hi galti.

  EMOTIONAL/DETAILED BAAT KE TIME GENTLE RAHO:
  Jab user apne dil ki baat share kare - kuch personal, vulnerable, ya 
  detail mein khulke bataye (jaise koi crush, family situation, koi 
  dikkat) - us waqt correction tone bilkul gentle aur warm honi chahiye, 
  seedha "yehi cheez pehle bhi galat hui thi" jaisa firm/frustrated tone 
  mat lo, chahe wahi galti pehle bhi hui ho. Pehle emotional connect karo, 
  phir bahut halke se correct karo. Aur jo ek galti pick ki hai use poora 
  aur clearly explain karo - jaldi mein adhoora mat chhodo.

  GALAT (rude/direct, emotional moment ignore karke): 
  "Yehi cheez abhi thodi der pehle bhi galat hui thi - yaad rakh, 'didn't' 
  ke baad 'go' hi aata hai, 'went' nahi. Ab bol phir se, dhyan se."
  
  SAHI (pehle warmth, phir gentle correction): 
  "Arre, tension mat le, tu akela nahi hai isme. Waise ek chhoti si baat - 
  'didn't' ke baad 'go' aata hai, 'went' nahi, kyunki 'didn't' mein hi 
  purani baat ka kaam ho jaata hai. To sentence hoga - 'I didn't go so 
  that my mom didn't have to work alone at home.'"

  Ek aur example:
  User bola (emotional): "i met with a girl today and she was so beautiful, 
  i wanted to tell her but this is not usa, it is india"
  
  GALAT (seedha correction pe kood jaana, feeling ignore karke): 
  "Galti hai - 'met with' nahi, 'met' bolte hain. Bol phir se."
  
  SAHI (pehle uski baat ko acknowledge karo, phir gently correct karo): 
  "Haha, achha! To kya hua, baat ki ya bas dekhta reh gaya? Waise ek 
  chhoti si baat - 'met with' nahi, seedha 'met' bolte hain kisi insaan 
  se milne ke liye. To sentence hoga - 'I met a girl today.'"

  Teesra example:
  User bola (thoda upset): "i failed in my exam and i dont know what to 
  told my parents"
  
  SAHI (pehle support, phir correction): 
  "Arre koi baat nahi, ek exam se kuch khatam nahi hota. Waise 'what to 
  told' nahi, 'what to tell' bolte hain - 'told' already ho chuki cheez 
  ke liye hai, yahan to abhi karna hai. To sentence hoga - 'I don't know 
  what to tell my parents.'"

  IMPORTANT GALTI KE BAAD CHECK-IN:
  Sabse important galti sudhaarne ke baad, poochho "samjh gya?" - agar 
  user haan bole, tabhi pucho "ek aur galti batau?" ya "aur galti thi, 
  batau?". Agar user haan kahe tabhi agli galti reveal karo, usi bridge 
  format mein. Agar user "nahi" ya kuch aur bole, to us round ki baat 
  khatam karo aur aage badho - zabardasti mat karo saari galtiyan ek 
  saath thopne ki.

  Example (same sentence continue karte hue - "if i say she would be my 
  girlfriend and yesterday i go there but she was not their"):

  Round 1: "Dekh, tum pehle ki baat kar rahe the na, agar bol diya hota - 
  to 'say' nahi 'said' hoga. To sentence hoga - 'If I said, she would be 
  my girlfriend.' Samjh gya?"
  
  User: "haan samjh gya"
  
  Tum: "Ek aur galti batau?"
  
  User: "haan bata"
  
  Tum: "Dekh 'i go there' - ye bhi pehle ki baat hai, to 'go' nahi 'went' 
  hoga. To sentence hoga - 'Yesterday I went there.'"

  Agar user pehle round ke baad "nahi" bole ya kuch aur topic pe chala 
  jaaye, to doosri galti (their/there) us waqt mat batao - chhod do ya 
  kabhi aur naturally aaye tab pakdo.

  Ek aur example (user "nahi" bolta hai):
  
  Round 1: "Dekh, 'buy' nahi 'bought' bolna tha kyunki ye kal ki baat hai. 
  To sentence hoga - 'I bought vegetables yesterday.' Samjh gya?"
  
  User: "haan"
  
  Tum: "Ek aur galti batau?"
  
  User: "nahi abhi rehne de"
  
  Tum: "Theek hai, chal aage badhte hain." (baaki galti chhod do, force 
  mat karo)

- Ek baar mein SIRF EK cheez poochni hai. Ya sentence bulwao, ya ek 
  follow-up sawaal pucho - dono EK SAATH kabhi mat karo.
  
  GALAT: "Sentence bol phir se, aur ye bhi bata ki tune medicine liya kya?"
  SAHI: Pehle sentence bulwao. Uske baad, agle message mein follow-up 
  sawaal pucho.
  
  Real bhai ek saath itna nahi poochta - natural conversation flow rakho.

CORRECTION INTENSITY (galti kitni baar hui uske hisaab se):
- 1st mistake: Quick fix, turant aage badho, bridge format use karke.
  Example: "Dekh 'pehle ho chuka' ko english mein bolte hain 'went'. 
  To sentence hoga - 'I went'."
- 2nd baar wahi mistake: Thoda firm reminder do, purani galti yaad dilao.
  Example: "Yehi cheez pehle bhi galat hui thi - yaad rakh, 'went'."
- 3rd baar ya usse zyada: Mild strictness dikhao, seriously lo.
  Example: "Sun, ye third time hai. Ab isko copy mein likh aur yaad kar. 
  Bol 'I went'."

LANGUAGE FLOW:
- Session hamesha Hinglish mein start karo, ek gentle challenge ke saath - 
  jaise "Aaj college mein kya kiya, English mein bata."
- Jaise hi user English bolna start kare, TURANT full English mein switch 
  karo. Ab deep follow-up questions pucho - small talk nahi, real 
  conversation jaisa engage karo.
- Agar user galti kare, YA atak jaaye aur pooche ("ye kya kehte hain?"), 
  toh turant Hinglish mein switch karo:
  - Bridge format se chhota correction do (max 3-4 lines)
  - Poora sentence jod ke dikhao
  - Wapas English mein switch karo
  Lecture kabhi mat do.
- Agar user koi word poochta hai, translation do aur turant push karo ki 
  wo use ek full sentence mein use kare.

CONTEXTUAL FOLLOW-UP QUESTIONS (GENERIC MAT PUCHO):
Follow-up sawaal hamesha pichli baat se naturally connect hona chahiye - 
generic ya disconnected sawaal mat pucho. User ne jo bola usi ke context 
mein agla sawaal banao, jaise ek real bhai baat ko follow karta hai.

GALAT (generic, context ignore karke): 
User: "i didnt go to school today"

function buildSystemInstruction(){
  const profile = window.__UKTIO_PROFILE || {};
  // NOTE: fallback ab "dost" nahi hai — kyunki naya persona "dost/bhai" jaise
  // address words ban karta hai. Agar naam missing hai to "tum" fallback karo,
  // aur buildBaseInstruction ke andar hi ye handle ho jaata hai (skip-naam clause).
  const userName = (profile.name && profile.name.trim()) || 'tum';
  let instruction = buildBaseInstruction(userName);

  const lines = [];

  if (profile.age) {
    lines.push(`${userName} ki age ${profile.age} saal hai.`);
  }

  if (profile.occupation_type === 'student' && profile.class_grade) {
    lines.push(`${userName} student hai — "${profile.class_grade}" mein padhta hai. Tone thoda friendly-mentor jaisa rakho.`);
  } else if (profile.occupation_type === 'professional' && profile.profession) {
    lines.push(`${userName} working professional hai — role: "${profile.profession}". Tone thoda more mature/peer-like rakho, kabhi kabhi work-related situations bhi topics mein use kar sakte ho.`);
  }

  if (profile.city) {
    lines.push(`${userName} "${profile.city}" se hai — kabhi kabhi casually is city ka reference use kar sakte ho (local jagah/food/context), lekin force mat karna, sirf natural lage tabhi.`);
  }

  if (lines.length){
    instruction += '\n\n═══════════════════════════════\nPERSONALIZATION — is specific user ke baare mein\n═══════════════════════════════\n\n' + lines.join('\n\n');
  }

  if (priorTranscriptText){
    instruction += `\n\n═══════════════════════════════\nRESUMING A PAST CONVERSATION\n═══════════════════════════════\n\nYe ek naya session nahi hai — ${userName} pichli baatcheet ko resume kar raha hai. Neeche pichli conversation hai (jo ho chuki thi):\n"""\n${priorTranscriptText}\n"""\nIsko yaad rakho aur naturally continue karo — jaise beech mein rukein ho. Shuruaat mein "Hello" ya fresh greeting se shuru mat karo; iski jagah pichli baat ka koi natural reference do (jaise "Haan to hum ye baat kar rahe the na...") phir aage badho.`;
  }
  return instruction;
}

let session = null;
let playCtx = null;
let micListenerHandle = null;
let nextPlayTime = 0;
let isModelSpeaking = false;
let scheduledSources = [];
let currentUserLine = null;
let currentModelLine = null;
let isBusy = false;
let errorAlreadyShown = false;

// Local-write, batch-sync chat history: turns get pushed here live as the
// conversation happens, persisted to localStorage at each turn boundary
// (crash-safe), then synced to the backend in ONE call when the session
// ends. currentTurnIndex tracks which sessionTurns[] entry is "in progress".
let sessionTurns = [];
let sessionStartedAt = null;
let currentTurnIndex = -1;
// Guards finalizeAndSyncSession() against firing twice for the same
// session — it now gets called both from stopSession() (normal, user-
// initiated stop) AND from the live-session's onclose callback (covers
// the case where the connection just dies on its own — e.g. a phone
// call takes over the mic — without ever going through stopSession()).
// When the user taps mic to stop, stopSession() closes the SDK session,
// which then asynchronously fires onclose on its own — without this
// guard, that would trigger a second, duplicate sync of the same turns.
let finalizeInFlight = false;

// Resume support: if ?resume=<session_id> is in the URL, we're
// continuing a past conversation rather than starting a fresh one.
// activeSessionId travels with every save so the backend appends to
// the same session instead of creating a new one. It's `let`, not
// `const`, because it also gets set the FIRST time a fresh (non-resumed)
// session gets synced — so if the user stops the mic and starts again
// without leaving this page, the 2nd+ leg appends to the same session
// too, instead of creating a new session row each time.
let activeSessionId = new URLSearchParams(window.location.search).get('resume') || null;
let priorTranscriptText = '';

const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const transcriptEl = document.getElementById('transcript');
const waveEl = document.getElementById('wave');
const reportPill = document.getElementById('reportPill');
const lockedBanner = document.getElementById('lockedBanner');

// Same threshold History uses to decide when a chat is "long enough" to
// analyze (chatRoutes.js's MIN_TURNS_FOR_ANALYSIS) — duplicated here since
// this is a static frontend file with no shared-constants import path to
// the backend. Keep these two in sync if it's ever tuned.
const MIN_TURNS_FOR_ANALYSIS = 10;

let isLocked = false; // true once this resumed session already has a report — blocks further recording
let knownTurnCount = 0; // running count for THIS session, seeded from resume data below, incremented locally as turns sync — avoids an extra network round-trip just to re-check the report-eligibility threshold after every save

function showReportPill(sessionId, hasReport){
  reportPill.textContent = hasReport ? '📊 Report dekho' : '📊 Report banao';
  reportPill.onclick = () => { window.location.href = 'report.html?session=' + sessionId + (hasReport ? '' : '&generate=1'); };
  reportPill.classList.add('show');
}

function lockChatForReport(sessionId){
  isLocked = true;
  lockedBanner.classList.add('show');
  document.getElementById('lockedSeeReport').onclick = () => { window.location.href = 'report.html?session=' + sessionId; };
  document.getElementById('lockedNewChat').onclick = () => { window.location.href = 'chat.html'; };
  micBtn.disabled = true;
  setStatus('Iss chat ka report ban chuka hai.', null);
}

/* API key ab is page ke saath store nahi hoti — Settings page (settings.html)
   isi localStorage key mein save karta hai; getApiKey() shared/mic-helpers.js
   se import hoti hai taaki chat.html/quiz.html mein ye logic do baar na likha ho. */

(function buildWave(){
  const BARS = 28;
  for (let i = 0; i < BARS; i++){
    const bar = document.createElement('span');
    const h = 6 + Math.round(Math.abs(Math.sin(i * 0.7)) * 26);
    bar.style.height = h + 'px';
    waveEl.appendChild(bar);
  }
})();

function setStatus(text, mode){
  statusText.textContent = text;
  statusDot.className = 'dot' + (mode ? ' ' + mode : '');
  micBtn.classList.toggle('active', mode === 'live');
  waveEl.classList.toggle('live', mode === 'live');
}

function scrollTranscriptToBottom(){
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function addLine(role){
  const div = document.createElement('div');
  div.className = 'line ' + role;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = role === 'user' ? 'Tum' : 'Bolo';
  const text = document.createElement('span');
  text.className = 'text';
  div.appendChild(tag);
  div.appendChild(text);
  transcriptEl.appendChild(div);
  scrollTranscriptToBottom();

  // A new line always means the previous turn (if any) just finished —
  // persist it now, then start tracking the new one.
  persistLocalSession();
  sessionTurns.push({ role: role === 'user' ? 'user' : 'assistant', content: '' });
  currentTurnIndex = sessionTurns.length - 1;

  return text;
}

// Renders a line from a PAST (already-saved) session — used only when
// resuming. Deliberately does NOT touch sessionTurns/currentTurnIndex,
// since these turns are already in the database; re-saving them would
// duplicate them.
function addHistoricalLine(role, content){
  const div = document.createElement('div');
  div.className = 'line historical ' + (role === 'user' ? 'user' : 'model');
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = role === 'user' ? 'Tum' : 'Bolo';
  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = content;
  div.appendChild(tag);
  div.appendChild(text);
  transcriptEl.appendChild(div);
}

// If ?resume=<id> is in the URL, fetch that session's past turns, show
// them (greyed out) at the top of the transcript, and build the text
// block that gets folded into the system prompt so Bolo remembers the
// conversation instead of starting cold.
async function loadResumeContextIfAny(){
  if (!activeSessionId) return;
  try{
    setStatus('Pichli baatcheet load ho rahi hai...', null);
    const data = await apiFetch('/chat/sessions/' + activeSessionId);
    const msgs = data.messages || [];

    if (msgs.length){
      const divider = document.createElement('div');
      divider.className = 'history-divider';
      divider.textContent = '── Pichli baatcheet ──';
      transcriptEl.appendChild(divider);
      msgs.forEach(m => addHistoricalLine(m.role, m.content));
      scrollTranscriptToBottom();

      // Cap the injected text so a very long past session doesn't blow
      // up the system prompt — keep the most recent ~6000 chars.
      const full = msgs.map(m => (m.role === 'user' ? 'User' : 'Bolo') + ': ' + m.content).join('\n');
      priorTranscriptText = full.length > 6000 ? full.slice(full.length - 6000) : full;
    }

    // Report affordance right here on the chat page (see file header note
    // in history.html for the same "Generate" vs "See report" logic) —
    // and the hard lock once a report already exists for this session
    // (see the matching 409 check server-side, POST /chat/sessions).
    const turnCount = (data.session && data.session.turn_count) || 0;
    knownTurnCount = turnCount;
    if (data.has_report){
      lockChatForReport(activeSessionId);
      return; // don't overwrite the locked status message below
    } else if (turnCount >= MIN_TURNS_FOR_ANALYSIS){
      showReportPill(activeSessionId, false);
    }

    setStatus('Shuru karne ke liye niche mic button dabao.', null);
  } catch(err){
    console.warn('resume context load failed, starting fresh instead', err);
    setStatus('Purani chat load nahi ho payi — naya session shuru kar sakte ho.', 'err');
  }
}
loadResumeContextIfAny();

// Writes the in-progress session to localStorage. Called at every turn
// boundary (see addLine above) and once more when the session stops, so
// a crash mid-session loses at most the last few words being spoken,
// never the whole conversation.
function persistLocalSession(){
  try {
    const meaningful = sessionTurns.filter(t => t.content && t.content.trim());
    if (!meaningful.length) { localStorage.removeItem(PENDING_CHAT_SESSION_KEY); return; }
    localStorage.setItem(PENDING_CHAT_SESSION_KEY, JSON.stringify({
      session_id: activeSessionId, // null for a fresh session, set when resuming
      started_at: sessionStartedAt,
      ended_at: new Date().toISOString(),
      messages: meaningful
    }));
  } catch(e){ console.warn('persistLocalSession failed', e); }
}

function describeMicError(err){
  const name = err && err.name;
  if (name === 'NotAllowedError' || name === 'PermissionDeniedError')
    return 'Mic band: tumne ya browser ne permission deny kar di. Address bar mein mic icon dabakar "Allow" karo.';
  if (name === 'NotFoundError' || name === 'DevicesNotFoundError')
    return 'Mic nahi mila: is device/browser mein koi microphone connected nahi hai.';
  if (name === 'NotReadableError' || name === 'TrackStartError')
    return 'Mic hardware abhi open nahi ho paya (dobara try ho chuki hai). Koi doosra app mic use kar raha ho to usse band karo, ya app ko ek baar dobara kholke try karo.';
  if (name === 'SecurityError')
    return 'Mic access block: yeh page HTTPS (ya localhost) par nahi chal raha, isliye browser mic nahi de raha.';
  if (name === 'OverconstrainedError')
    return 'Mic settings match nahi hui is device mein.';
  return 'Mic access mein error: ' + (err && err.message ? err.message : 'wajah pata nahi chali (' + err + ')');
}

function describeConnectError(err){
  const msg = (err && err.message) ? err.message : String(err);
  if (/api key not valid|api_key_invalid|invalid api key/i.test(msg))
    return 'API key galat hai — Settings mein Google AI Studio se copy karke phir se paste karo.';
  if (/quota|resource_exhausted|rate limit/i.test(msg))
    return 'API quota/rate-limit khatam ho gaya — thodi der ruk kar try karo ya naya key banao.';
  if (/permission_denied|not authorized/i.test(msg))
    return `Yeh API key Live API (${LIVE_MODEL}) use nahi kar sakti — key ki permissions check karo.`;
  if (/failed to fetch|network|timeout|ENOTFOUND/i.test(msg))
    return 'Google se connect nahi ho paya — internet connection check karo.';
  if (/model not found|not_found/i.test(msg))
    return 'Model available nahi hai is region/account ke liye.';
  return 'Connect nahi ho paya, wajah: ' + msg;
}

function describeCloseEvent(e){
  if (!e) return 'Session band ho gaya (koi close-details nahi mile).';
  if (e.code === 1000) return null;
  const reason = e.reason ? (' — ' + e.reason) : ' (server ne koi reason text nahi bheja)';
  return 'Session band ho gaya, code ' + e.code + reason + '. Ye us API key/model access ki taraf se koi dikkat ho sakti hai.';
}

function floatTo16BitPCM(float32Array){
  const out = new Int16Array(float32Array.length);
  for (let i = 0; i < float32Array.length; i++){
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function int16ToBase64(int16Array){
  const bytes = new Uint8Array(int16Array.buffer);
  const CHUNK = 0x8000;
  let binary = '';
  for (let i = 0; i < bytes.length; i += CHUNK){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

function base64ToInt16(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}

function playAudioChunk(base64Data){
  if (!playCtx) return;
  try{
    isModelSpeaking = true;
    const int16 = base64ToInt16(base64Data);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

    const buffer = playCtx.createBuffer(1, float32.length, 24000);
    buffer.copyToChannel(float32, 0);

    const src = playCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(playCtx.destination);

    const now = playCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now + 0.05;
    src.start(nextPlayTime);
    nextPlayTime += buffer.duration;
    scheduledSources.push(src);
    src.onended = () => {
      scheduledSources = scheduledSources.filter(s => s !== src);
      if (scheduledSources.length === 0){
        setTimeout(() => {
          if (scheduledSources.length === 0) isModelSpeaking = false;
        }, 200);
      }
    };
  }catch(err){
    console.error('playback error', err);
    setStatus('Audio playback mein dikkat: ' + err.message, 'err');
  }
}

function stopPlayback(){
  scheduledSources.forEach(s => { try{ s.stop(); }catch(e){ /* already stopped, ignore */ } });
  scheduledSources = [];
  isModelSpeaking = false;
  if (playCtx) nextPlayTime = playCtx.currentTime;
}

// ---- screen-off fix: keep the app process alive (foreground service +
// wakelock, see VoiceKeepAliveService.java) for the whole live session —
// this session's mic stays open continuously and playback happens
// interleaved with it (see isModelSpeaking), so tying this to session
// start/stop (below) is sufficient — no per-turn handling needed here.
let keepAliveActive = false;
async function startKeepAlive(){
  if (keepAliveActive) return;
  keepAliveActive = true;
  try{ await getMicCapturePlugin().startKeepAlive(); }catch(e){ /* browser preview or plugin missing — ignore */ }
}
async function stopKeepAlive(){
  if (!keepAliveActive) return;
  keepAliveActive = false;
  try{ await getMicCapturePlugin().stopKeepAlive(); }catch(e){ /* ignore */ }
}

async function startNativeMic(){
  const MicCapture = getMicCapturePlugin();

  micListenerHandle = await MicCapture.addListener('audioChunk', (data) => {
    if (!session || !data || !data.audio) return;
    if (isModelSpeaking) return;
    try{
      session.sendRealtimeInput({ audio: { data: data.audio, mimeType: 'audio/pcm;rate=16000' } });
    }catch(err){
      console.error('mic send error', err);
      setStatus('Audio bhejte waqt error: ' + err.message, 'err');
    }
  });

  await MicCapture.start();
}

async function stopNativeMic(){
  try{
    const MicCapture = getMicCapturePlugin();
    await MicCapture.stop();
  }catch(e){ /* plugin already gone ya nahi mila, ignore */ }
  if (micListenerHandle){
    try{ await micListenerHandle.remove(); }catch(e){}
    micListenerHandle = null;
  }
}

async function startSession(){
  if (session || isBusy) return;
  if (isLocked){ setStatus('Iss chat ka report ban chuka hai — naya chat shuru karo.', 'err'); return; }

  // Do NOT reset sessionTurns/currentTurnIndex here — if the user stops
  // the mic and taps it again without leaving this page, we want THIS
  // restart to continue the same conversation (same backend session,
  // same memory of what was said), not start a blank one. Only the
  // very first tap in this page view sets sessionStartedAt.
  if (!sessionStartedAt) sessionStartedAt = new Date().toISOString();

  const apiKey = getApiKey();
  if (!apiKey){
    setStatus('Pehle Settings mein apni Gemini API key daalo.', 'err');
    window.location.href = 'settings.html';
    return;
  }

  isBusy = true;
  micBtn.disabled = true;
  setStatus('Key check ho rahi hai...', null);
  const keyCheck = await checkGeminiApiKey(apiKey);
  if (keyCheck.status !== 'valid'){
    isBusy = false;
    micBtn.disabled = false;
    setStatus((keyCheck.message || 'API key sahi nahi hai') + ' — Settings mein jaake theek karo.', 'err');
    setTimeout(() => { window.location.href = 'settings.html'; }, 1600);
    return;
  }

  await startKeepAlive(); // before connect — covers the whole session below, mic + playback both

  setStatus('Gemini se connect ho raha hai...', null);
  try{
    const ai = new GoogleGenAI({ apiKey, apiVersion: 'v1alpha' });

    session = await ai.live.connect({
      model: LIVE_MODEL,
      config: {
        responseModalities: [Modality.AUDIO],
        systemInstruction: { parts: [{ text: buildSystemInstruction() }] },
        inputAudioTranscription: {},
        outputAudioTranscription: {},
        speechConfig: {
          voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Puck' } }
        }
      },
      callbacks: {
        onopen: () => {
          setStatus('Connected — mic on, bolna shuru karo', 'live');
          micBtn.disabled = false;
          isBusy = false;
        },
        onmessage: (msg) => handleMessage(msg),
        onerror: (e) => {
          console.error('live session error', e);
          const detail = (e && e.message) ? e.message : 'connection ne error event bheja, exact wajah server ne nahi batayi';
          setStatus('Connection error — ' + detail, 'err');
          errorAlreadyShown = true;
          stopSession(true);
        },
        onclose: (e) => {
          if (!errorAlreadyShown){
            const msg = describeCloseEvent(e);
            if (msg) setStatus(msg, 'err'); else setStatus('Session band ho gaya.', null);
          }
          errorAlreadyShown = false;
          // The connection is already dead by the time this fires — clear
          // it so the next mic tap starts a fresh session instead of
          // trying to "stop" one that's already closed. This is the path
          // a phone call (or the OS otherwise taking the mic away) goes
          // through: the SDK closes the connection on its own, without
          // ever going through our own stopSession().
          session = null;
          micBtn.disabled = false;
          isBusy = false;
          // Make sure whatever was said in this session actually gets
          // synced — this is the same recovery path stopSession() uses.
          // Safe to call unconditionally: if stopSession() already
          // triggered this (a normal user-initiated stop), sessionTurns
          // is already empty / finalizeInFlight is already set, so this
          // is a harmless no-op.
          finalizeAndSyncSession();
        }
      }
    });

    playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    nextPlayTime = 0;

    setStatus('Mic (native) shuru ho raha hai...', null);
    try{
      await startNativeMic();
      setStatus('Connected — mic on, bolna shuru karo', 'live');
    }catch(err){
      console.error('native mic error', err);
      setStatus('Native mic start nahi ho paya: ' + (err && err.message ? err.message : err), 'err');
      errorAlreadyShown = true;
      stopSession(true);
      return;
    }

  }catch(err){
    console.error('connect error', err);
    setStatus(describeConnectError(err), 'err');
    micBtn.disabled = false;
    isBusy = false;
    stopKeepAlive(); // connect itself failed — no session was ever created, so stopSession() never runs to release this
  }
}

function handleMessage(msg){
  try{
    const content = msg.serverContent;
    if (!content) return;

    if (content.interrupted){
      stopPlayback();
    }

    if (content.inputTranscription && content.inputTranscription.text){
      currentModelLine = null;
      if (!currentUserLine) currentUserLine = addLine('user');
      currentUserLine.textContent += content.inputTranscription.text;
      if (currentTurnIndex >= 0) sessionTurns[currentTurnIndex].content += content.inputTranscription.text;
      scrollTranscriptToBottom();
    }

    if (content.outputTranscription && content.outputTranscription.text){
      currentUserLine = null;
      if (!currentModelLine) currentModelLine = addLine('model');
      currentModelLine.textContent += content.outputTranscription.text;
      if (currentTurnIndex >= 0) sessionTurns[currentTurnIndex].content += content.outputTranscription.text;
      scrollTranscriptToBottom();
    }

    if (content.modelTurn && content.modelTurn.parts){
      for (const part of content.modelTurn.parts){
        if (part.inlineData && part.inlineData.data){
          playAudioChunk(part.inlineData.data);
        }
      }
    }

    if (content.turnComplete){
      isModelSpeaking = false;
    }
  }catch(err){
    console.error('message handling error', err, msg);
    setStatus('Ek message process karte waqt error aaya: ' + err.message, 'err');
  }
}

function stopSession(silent){
  stopKeepAlive();
  stopNativeMic().catch((e) => console.error('stopNativeMic error', e));

  stopPlayback();
  if (playCtx){ try{ playCtx.close(); }catch(e){} playCtx = null; }
  if (session){ try{ session.close(); }catch(e){ console.error('session close error', e); } session = null; }

  isBusy = false;
  micBtn.disabled = false;
  if (!silent) setStatus('Ruk gaya. Dobara shuru karne ke liye mic dabao.', null);

  finalizeAndSyncSession();
}

// Captures the final state of whatever's currently in progress, then
// hands off to the SAME sync helper index.html uses for crash recovery —
// so there's exactly one place that talks to POST /chat/sessions.
// Fire-and-forget: local data already exists, so even if this fails
// (network down right at session-end), next app-open recovery retries it.
//
// Also folds the just-finished turns into priorTranscriptText and locks
// in activeSessionId — so if the user taps the mic again without leaving
// this page, buildSystemInstruction() still has full memory of what was
// said, AND the new turns append to the same session instead of a new one.
async function finalizeAndSyncSession(){
  if (!sessionTurns.length || finalizeInFlight) return;
  finalizeInFlight = true;
  try {
    persistLocalSession();

    const justSpoken = sessionTurns
      .filter(t => t.content && t.content.trim())
      .map(t => (t.role === 'user' ? 'User' : 'Bolo') + ': ' + t.content)
      .join('\n');
    if (justSpoken){
      priorTranscriptText = priorTranscriptText ? (priorTranscriptText + '\n' + justSpoken) : justSpoken;
      if (priorTranscriptText.length > 6000) priorTranscriptText = priorTranscriptText.slice(priorTranscriptText.length - 6000);
    }

    const syncedSessionId = await syncPendingChatSession();
    if (syncedSessionId){
      activeSessionId = syncedSessionId;
      // Just-finished turns synced successfully — check if this session now
      // crosses the report threshold, and if so surface the pill immediately
      // instead of making the user go find it in History.
      knownTurnCount += sessionTurns.length;
      if (!isLocked && !reportPill.classList.contains('show') && knownTurnCount >= MIN_TURNS_FOR_ANALYSIS){
        showReportPill(activeSessionId, false);
      }
    }

    sessionTurns = [];
    currentTurnIndex = -1;
    // sessionStartedAt is deliberately NOT reset — if the mic gets tapped
    // again in this same page view, it's still the same overall session.
  } finally {
    finalizeInFlight = false;
  }
}

window.addEventListener('beforeunload', () => {
  if (session) stopSession(true);
});

window.addEventListener('error', (e) => {
  console.error('uncaught error', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('unhandled promise rejection', e.reason);
});

micBtn.addEventListener('click', () => {
  if (session) stopSession();
  else startSession();
});
</script>
</body>
</html>
