<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://utkio-backend.onrender.com https://pwdglktwuquoswqoyely.supabase.co https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://*.sentry.io https://*.ingest.sentry.io; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>Utkio — Report</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .wrap{ overflow-y:auto; }

  /* ---- The whole report as one flowing, readable write-up ---- */
  .report-article{
    background:var(--card); border-radius:18px; padding:24px 22px; margin:16px 0 28px;
    box-shadow:0 6px 18px -12px rgba(60,60,120,0.2);
    font-size:0.96rem; line-height:1.75; color:var(--ink);
  }
  .report-article p{ margin:0 0 16px; }
  .report-article p:last-child{ margin-bottom:0; }
  .report-article strong{ color:var(--accent); font-weight:700; }

  .generate-state{ text-align:center; padding:60px 20px; }
  .generate-state svg{ color:var(--accent-orange); margin-bottom:16px; }
  .generate-state p{ color:var(--ink-dim); font-size:0.88rem; margin-bottom:20px; }
  .spinner-ring{
    width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--accent-orange);
    border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="icon-btn" href="history.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="app-title" style="font-size:1.2rem;">Report</h1>
    <span style="width:38px;"></span>
  </header>

  <div id="content"></div>
</div>

<script type="module">
import './shared/config.js';
import { requireAuthOrRedirect, apiFetch } from './shared/auth.js';
import { initBackNav } from './shared/back-nav.js';
import { escapeHtml } from './shared/sanitize.js';
import { cachedFetch } from './shared/api-cache.js';

await requireAuthOrRedirect();
initBackNav('history.html');

const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session');

async function fetchSessionReport(id) {
  const { value } = await cachedFetch('session_report_' + id, () => apiFetch('/chat/sessions/' + id + '/report'), 24 * 60 * 60 * 1000);
  return value;
}
const shouldAutoGenerate = params.get('generate') === '1';
const content = document.getElementById('content');

function renderGenerateState(message, showButton){
  content.innerHTML = `
    <div class="generate-state">
      ${showButton ? '' : '<div class="spinner-ring"></div>'}
      <p>${message}</p>
      ${showButton ? '<button class="primary" id="genBtn" style="width:auto;padding:12px 28px;">Generate Report</button>' : ''}
    </div>`;
  if (showButton) {
    const genBtn = document.getElementById('genBtn');
    // Disable + relabel the SAME click the user just made, synchronously,
    // before generateReport()'s own async work even starts — belt-and-
    // suspenders alongside generateReport() immediately re-rendering this
    // whole block away (which already removes genBtn from the DOM). This
    // is what stops a user from firing this off twice in the small window
    // before that re-render happens.
    genBtn.addEventListener('click', () => {
      genBtn.disabled = true;
      genBtn.textContent = 'Generating…';
      generateReport();
    });
  }
}

// Turns the report's plain text (Markdown-style **bold**, blank lines
// between sections — see prompt_configs.chat_analysis) into safe HTML.
// AI-generated text, so this ALWAYS escapes first — same rule as the
// rest of the app (see README's XSS note) — and only then inserts the
// small set of tags we control ourselves (<p>, <strong>, <br>), never
// tags that came from the model's output.
function renderReportText(text){
  const escaped = escapeHtml(text || '');
  const withBold = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const blocks = withBold.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => `<p>${b.replace(/\n/g, '<br>')}</p>`).join('');
}

function renderReport(report){
  content.innerHTML = `<div class="report-article">${renderReportText(report.report_text)}</div>`;
}

// Guards against this exact page instance somehow calling generateReport()
// twice concurrently (e.g. the auto-generate-on-load path in init() below
// racing with a manual click, in some odd navigation-timing edge case).
// The real, authoritative guard against duplicate *requests to the server*
// is the backend's atomic claim (see routes/chatRoutes.js) — this is just
// an extra local safety net so this tab never even tries.
let generateInFlight = false;

async function generateReport(){
  if (generateInFlight) return;
  generateInFlight = true;
  renderGenerateState('Report generate ho raha hai... isme 10-20 seconds lag sakte hain.', false);
  try {
    const data = await apiFetch('/chat/sessions/' + sessionId + '/analyze', { method: 'POST' });
    renderReport(data.report);
  } catch (err) {
    if (err.status === 409){
      // Someone else's request for this exact session (another tab, a
      // previous click that hasn't finished yet, etc.) already claimed
      // generation — see routes/chatRoutes.js. Don't show this as an
      // error or offer a "Generate" button (clicking it would just 409
      // again); instead wait for the other request to actually finish.
      pollForReport();
      return;
    }
    if (err.status === 402){
      content.innerHTML = `
        <div class="generate-state">
          <div style="font-size:2.2rem; margin-bottom:12px;" aria-hidden="true">📊</div>
          <h2 style="font-size:1.25rem; font-weight:700; margin-bottom:8px; color:var(--ink);">Report Limit Reached</h2>
          <p style="margin-bottom:24px; color:var(--ink-dim);">${escapeHtml(err.message || 'Free trial ke reports use ho chuke hain — jaari rakhne ke liye plan lo.')}</p>
          <a class="primary" href="pricing.html?reason=report_limit" style="display:inline-block; text-decoration:none; padding:12px 28px; border-radius:12px;">Upgrade Plan to View Analysis</a>
        </div>`;
      return;
    }
    renderGenerateState('Report banane mein dikkat hui: ' + escapeHtml(err.message || 'Try again') + '.', true);
  } finally {
    generateInFlight = false;
  }
}

// Polls GET /report every few seconds until it succeeds — used only when
// we know generation is already happening (via a 409 from /analyze above),
// so this is "wait for the result", not "keep guessing if anything is
// happening at all".
async function pollForReport(attempt){
  attempt = attempt || 0;
  const MAX_ATTEMPTS = 12; // ~40s total — generous vs. the normal ~10-20s generation time
  const DELAY_MS = 3000;

  renderGenerateState('Report already generate ho raha hai — thoda ruko...', false);
  try {
    const data = await apiFetch('/chat/sessions/' + sessionId + '/report');
    renderReport(data.report);
  } catch (err) {
    if (err.status === 404 && attempt < MAX_ATTEMPTS){
      setTimeout(() => pollForReport(attempt + 1), DELAY_MS);
    } else if (attempt >= MAX_ATTEMPTS){
      renderGenerateState('Report banne mein expected se zyada time lag raha hai — thodi der baad wapas aake dekho.', true);
    } else {
      renderGenerateState('Could not load the report: ' + escapeHtml(err.message), true);
    }
  }
}

async function init(){
  if (!sessionId){
    content.innerHTML = '<div class="status-msg err" style="margin-top:20px;">Session ID missing.</div>';
    return;
  }
  try {
    const data = await fetchSessionReport(sessionId);
    renderReport(data.report);
  } catch (err) {
    if (err.status === 404){
      if (shouldAutoGenerate) generateReport();
      else renderGenerateState('Is chat ka abhi tak koi report nahi bana hai.', true);
    } else {
      renderGenerateState('Could not load the report: ' + escapeHtml(err.message), true);
    }
  }
}

init();
</script>
</body>
</html>
