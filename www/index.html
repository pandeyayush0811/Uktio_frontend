<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--
  Content-Security-Policy — defense-in-depth against XSS: even if a spot
  is ever missed where dynamic content (AI output, transcripts) gets
  written into the DOM without shared/sanitize.js's escapeHtml(), this
  stops the resulting script from running/exfiltrating data, and it
  blocks any request to a domain we didn't explicitly allow below.

  script-src/style-src need 'unsafe-inline': every page in this app uses
  inline <script type="module"> and <style> blocks (no bundler/build
  step), so hash- or nonce-based CSP isn't practical here without a much
  bigger restructure. This is a known, accepted trade-off — it still
  blocks attribute-injection style XSS (onerror=, javascript: URLs) via
  object-src/base-uri/form-action, and fully blocks exfiltration to any
  domain not in connect-src, which covers the actual risk this app faces
  (innerHTML with unescaped AI/transcript text reaching an attacker's
  server). Keep connect-src in sync with shared/config.js's BACKEND_URL
  and any new external API this app starts calling.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://utkio-backend.onrender.com https://pwdglktwuquoswqoyely.supabase.co https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://*.sentry.io https://*.ingest.sentry.io; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>Utkio</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap splash-wrap">
  <div class="splash-glow" aria-hidden="true"></div>

  <svg class="splash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path class="logo-arc" d="M42 28 A15 15 0 0 0 28 43" stroke="var(--accent-orange)" stroke-width="11" stroke-linecap="round"/>
    <path d="M30 40 V63 A20 20 0 0 0 70 63 V40" stroke="var(--accent-orange)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <h1 class="app-title splash-title-anim">Utkio</h1>
  <div class="spinner splash-loader" aria-hidden="true"></div>
  <p class="hint splash-hint-anim" id="splashStatus" role="status" aria-live="polite" style="min-height:1.2em;"></p>
</div>

<!--
  IMPORTANT: Capacitor always loads index.html as the app's entry point,
  it can't be renamed to splash.html. So this file plays the role of your
  "splash" screen — it just checks if you're logged in and forwards
  immediately to the right page. Nothing else lives here.
-->
<script type="module">
import './shared/config.js';
import { getSession, goToPostAuthDestination, syncPendingChatSession } from './shared/auth.js';
import { initBackNav } from './shared/back-nav.js';
initBackNav(null);

const splashStatus = document.getElementById('splashStatus');

setTimeout(async () => {
  const session = await getSession();
  if (session && session.access_token) {
    // Wait for any pending offline session to finish syncing BEFORE
    // navigating away. Previously this was fire-and-forget, racing
    // against goToPostAuthDestination()'s own navigation — if that
    // navigation won the race (common: it's often a faster call), the
    // browser/WebView cancels this still-in-flight request and the
    // session is lost for good (it only lived in localStorage on this
    // one device, and never reaches the DB). syncPendingChatSession()
    // itself is a no-op (resolves immediately) when there's nothing
    // pending, so this adds no delay for the common case.
    await syncPendingChatSession();
    goToPostAuthDestination(text => { splashStatus.textContent = text; });
  } else {
    window.location.href = 'login.html';
  }
}, 500);
</script>
</body>
</html>
