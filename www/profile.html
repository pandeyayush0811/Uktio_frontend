<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://utkio-backend.onrender.com https://pwdglktwuquoswqoyely.supabase.co https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://*.sentry.io https://*.ingest.sentry.io; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>Utkio — Profile</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  /* Page-scoped overrides only. Reusable structural pieces (section
     headers, icon-inputs, goal/level chip variants, bottom action bar,
     avatar-initial) now live in shared/style.css as documented in
     DESIGN_SYSTEM.md's "profile.html structural rebuild" log entry —
     they're generic enough other pages will likely reuse them. */
  .wrap{ padding-bottom:0; }
  #editForm .goal-chip.selected,
  #editForm .level-chip.selected,
  #editForm .chip.selected{ border-color:var(--accent-orange); background:var(--accent-soft-orange); color:var(--accent-orange); }
  #editForm .goal-chip:hover,
  #editForm .level-chip:hover,
  #editForm .chip:hover{ border-color:var(--accent-orange); }
  #editForm input:focus, #editForm textarea:focus{ border-color:var(--accent-orange); box-shadow:0 0 0 3px var(--accent-soft-orange); }
  #editForm .field-icon-input input:focus,
  #editForm .field-icon-input.focused{ border-color:var(--accent-orange); box-shadow:0 0 0 3px var(--accent-soft-orange); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Back" id="backLink">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="app-title" style="font-family:var(--font-serif); font-size:1.25rem;" id="pageTitle">Profile</h1>
    <span style="width:38px;"></span>
  </header>

  <div class="page-loader" id="loadingMsg" style="margin-top:8px;">
    <div class="loader-ring"></div>
    <span class="loader-label">Loading profile…</span>
  </div>

  <div class="profile-scroll-area">
    <div class="profile-shell">

      <!-- ================= VIEW MODE ================= -->
      <div id="viewMode" class="view-mode hidden">

        <div class="profile-hero">
          <div class="profile-hero-avatar" id="vAvatar">
            <span id="vAvatarInitial"></span>
            <svg id="vAvatarFallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="30" height="30"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="profile-hero-name-row">
            <span class="profile-hero-name" id="vName"><span class="skeleton-line" style="width:120px;height:1.1em;display:inline-block;"></span></span>
            <span class="profile-hero-badge" id="vLevelBadge" style="display:none;"></span>
          </div>
          <div class="profile-hero-email" id="vEmail"><span class="skeleton-line" style="width:140px;height:0.9em;display:inline-block;"></span></div>
        </div>

        <div class="profile-stat-strip" id="statStrip">
          <div class="profile-stat" id="statGoal" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
            <div><div class="profile-stat-label">Goal</div><div class="profile-stat-value" id="vGoalStat"><span class="skeleton-pill"></span></div></div>
          </div>
          <div class="profile-stat" id="statTime" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
            <div><div class="profile-stat-label">Practice time</div><div class="profile-stat-value" id="vTimeStat"><span class="skeleton-pill"></span></div></div>
          </div>
        </div>

        <div class="profile-fields-card">
          <div class="profile-section-label">Personal</div>
          <div class="profile-row">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
            <div><div class="profile-row-label">Name</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vNameRow"><span class="skeleton-line" style="width:80px;height:1em;display:inline-block;"></span></span></div>
          </div>
          <div class="profile-row">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
            <div><div class="profile-row-label">Age</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vAge"><span class="skeleton-line" style="width:40px;height:1em;display:inline-block;"></span></span></div>
          </div>
          <div class="profile-row" id="vCityRow" style="display:none;">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
            <div><div class="profile-row-label">City</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vCity"><span class="skeleton-line" style="width:70px;height:1em;display:inline-block;"></span></span></div>
          </div>

          <div class="profile-section-label">Learning profile</div>
          <div class="profile-row" style="flex-direction:column;align-items:flex-start;">
            <div style="display:flex;align-items:center;gap:12px;width:100%;">
              <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
              <div class="profile-row-label">Occupation</div>
            </div>
            <div class="profile-toggle-row" style="width:100%;">
              <div class="profile-toggle" id="vOccStudent">Student</div>
              <div class="profile-toggle" id="vOccPro">Working Professional</div>
            </div>
          </div>
          <div class="profile-row">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg></div>
            <div><div class="profile-row-label" id="vOccDetailLabel">Class / Degree / Course</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vOccDetail"><span class="skeleton-line" style="width:90px;height:1em;display:inline-block;"></span></span></div>
          </div>
          <div class="profile-row">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></div>
            <div><div class="profile-row-label">Goal</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vGoalRow"><span class="skeleton-line" style="width:100px;height:1em;display:inline-block;"></span></span></div>
          </div>
          <div class="profile-row">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></div>
            <div><div class="profile-row-label">Level</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vLevelRow"><span class="skeleton-line" style="width:60px;height:1em;display:inline-block;"></span></span></div>
          </div>
          <div class="profile-row">
            <div class="profile-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></div>
            <div><div class="profile-row-label">Practice time</div></div>
            <div class="profile-row-right"><span class="profile-row-value" id="vTimeRow"><span class="skeleton-line" style="width:70px;height:1em;display:inline-block;"></span></span></div>
          </div>
        </div>
      </div>

      <!-- ================= EDIT MODE ================= -->
      <div class="card edit-form" id="editForm" style="padding:0;">

        <div class="profile-section-header">
          <div class="profile-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <span>Basic info</span>
        </div>
        <div class="field-group">
          <label for="f_name">Name</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="f_name">
          </div>
          <label for="f_age">Age</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input type="text" inputmode="numeric" id="f_age">
          </div>
        </div>

        <div class="profile-section-divider"></div>

        <div class="profile-section-header">
          <div class="profile-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
          <span>About you</span>
        </div>
        <div class="field-group">
          <label>Student or working professional?</label>
          <div class="chip-group compact" id="f_occ" style="flex-direction:row;flex-wrap:wrap;"></div>

          <label id="occDetailLabel" for="f_occdetail">Class/course</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
            <input type="text" id="f_occdetail">
          </div>

          <label for="f_city">City (optional)</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <input type="text" id="f_city">
          </div>
        </div>

        <div class="profile-section-divider"></div>

        <div class="profile-section-header">
          <div class="profile-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></div>
          <span>Goal &amp; level</span>
        </div>
        <div class="field-group">
          <label>Goal</label>
          <div class="chip-group" id="f_goal"></div>

          <label>Your current English level</label>
          <div class="chip-group compact" id="f_level" style="flex-direction:row;flex-wrap:wrap;"></div>

          <label>How much time do you practice each day?</label>
          <div class="chip-group compact" id="f_time" style="flex-direction:row;flex-wrap:wrap;"></div>
        </div>

        <div class="profile-section-divider"></div>

        <div class="profile-section-header">
          <div class="profile-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <span>Tell us about yourself</span>
        </div>
        <div class="field-group" style="padding-bottom:4px;">
          <label for="f_sample" class="sr-visible-label">In English, so we can gauge your level</label>
          <textarea id="f_sample" maxlength="500"></textarea>
          <div class="char-hint" id="charHint">0 / 500</div>
        </div>

        <div class="status-msg" id="saveStatus" style="padding:0 18px;"></div>
      </div>

    </div>
  </div>

  <!-- Bottom action bar — flex child of .wrap, not viewport-fixed, so it
       plays well with Capacitor's WebView + safe-area insets without
       fighting the keyboard. Swaps content between view/edit modes. -->
  <div class="profile-bottom-bar" id="bottomBar">
    <button class="edit-profile-btn" id="editBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
      Edit Profile
    </button>
    <div class="profile-bottom-bar-edit" id="editActionsBar">
      <button class="primary" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="saveBtnLabel">Save changes</span>
      </button>
      <button class="secondary-outline" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import './shared/config.js';
import { requireAuthOrRedirect, apiFetch, getCachedProfileBasic, setCachedProfileBasic, getCachedFullProfile, setCachedFullProfile } from './shared/auth.js';
import { initBackNav } from './shared/back-nav.js';

await requireAuthOrRedirect();
initBackNav('home.html');

const GOAL_OPTIONS = [
  { value: 'interview', label: 'Job interview / professional English', icon: 'briefcase' },
  { value: 'daily_confidence', label: 'Roz ki confidence', icon: 'chat' },
  { value: 'exam_prep', label: 'Exam prep (IELTS/TOEFL)', icon: 'book' },
  { value: 'travel', label: 'Travel', icon: 'plane' },
  { value: 'content_creation', label: 'Content creation', icon: 'camera' },
  { value: 'general', label: 'General improvement', icon: 'compass' }
];
const LEVEL_OPTIONS = [
  { value: 'beginner', label: 'Beginner' }, { value: 'intermediate', label: 'Intermediate' }, { value: 'advanced', label: 'Advanced' }
];
const TIME_OPTIONS = [
  { value: '5_10', label: '5–10 min' }, { value: '15_20', label: '15–20 min' }, { value: '30_plus', label: '30+ min' }
];
const OCC_OPTIONS = [ { value: 'student', label: 'Student', icon: 'cap' }, { value: 'professional', label: 'Professional', icon: 'briefcase' } ];

// Small inline-icon set for chip labels — kept as a lookup here rather
// than in shared/style.css since these are content-mapped (per option
// value), not a generic reusable component.
const ICONS = {
  briefcase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  plane: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 22 4l-8 18-2-8-8-2z"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
  cap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9"/></svg>'
};

function labelFor(options, value){
  const opt = options.find(o => o.value === value);
  return opt ? opt.label : null;
}

let profile = {};
let email = '';

// Plain chip renderer (occupation toggle in edit form — text-only, no icon needed there beyond existing pattern).
function renderChips(container, options, currentValue, onSelect){
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (currentValue === opt.value ? ' selected' : '');
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      container.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      onSelect(opt.value);
    });
    container.appendChild(btn);
  });
}

// Icon + label chip renderer, used for Goal (full-width rows with a
// leading icon + trailing check-badge on selection) and for Occupation
// (compact side-by-side chips with a leading icon).
function renderIconChips(container, options, currentValue, onSelect, variant){
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const selected = currentValue === opt.value;
    btn.className = variant + (selected ? ' selected' : '');
    btn.innerHTML = `<span class="chip-icon">${ICONS[opt.icon] || ''}</span><span class="chip-label">${opt.label}</span>` +
      (variant === 'goal-chip' ? `<span class="chip-check">${selected ? ICONS.check : ''}</span>` : '');
    btn.addEventListener('click', () => {
      container.querySelectorAll('.' + variant.split(' ')[0]).forEach(c => {
        c.classList.remove('selected');
        if (variant === 'goal-chip') { const chk = c.querySelector('.chip-check'); if (chk) chk.innerHTML = ''; }
      });
      btn.classList.add('selected');
      if (variant === 'goal-chip') btn.querySelector('.chip-check').innerHTML = ICONS.check;
      onSelect(opt.value);
    });
    container.appendChild(btn);
  });
}

// Compact text-only pill row (Level, Practice time) — short labels, no icon needed, horizontal wrap.
function renderCompactChips(container, options, currentValue, onSelect){
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'level-chip' + (currentValue === opt.value ? ' selected' : '');
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      container.querySelectorAll('.level-chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      onSelect(opt.value);
    });
    container.appendChild(btn);
  });
}

function setAvatarInitial(name){
  const initialEl = document.getElementById('vAvatarInitial');
  const fallbackEl = document.getElementById('vAvatarFallback');
  const letter = (name || '').trim().charAt(0).toUpperCase();
  if (letter) {
    initialEl.textContent = letter;
    initialEl.style.display = 'block';
    fallbackEl.style.display = 'none';
  } else {
    initialEl.style.display = 'none';
    fallbackEl.style.display = 'block';
  }
}

function renderView(){
  document.getElementById('vName').textContent = profile.name || '—';
  document.getElementById('vEmail').textContent = email || '—';
  document.getElementById('vNameRow').textContent = profile.name || '—';
  document.getElementById('vAge').textContent = profile.age || '—';
  setAvatarInitial(profile.name);

  const cityRow = document.getElementById('vCityRow');
  if (profile.city) {
    cityRow.style.display = 'flex';
    document.getElementById('vCity').textContent = profile.city;
  } else {
    cityRow.style.display = 'none';
  }

  const isStudent = profile.occupation_type === 'student';
  document.getElementById('vOccStudent').classList.toggle('selected', isStudent);
  document.getElementById('vOccPro').classList.toggle('selected', !isStudent && profile.occupation_type === 'professional');
  document.getElementById('vOccDetailLabel').textContent = isStudent ? 'Class / Degree / Course' : 'Profession / Role';
  document.getElementById('vOccDetail').textContent = (isStudent ? profile.class_grade : profile.profession) || '—';

  const goalLabel = labelFor(GOAL_OPTIONS, profile.goal);
  const levelLabel = labelFor(LEVEL_OPTIONS, profile.self_level);
  const timeLabel = labelFor(TIME_OPTIONS, profile.daily_time);

  document.getElementById('vGoalRow').textContent = goalLabel || '—';
  document.getElementById('vLevelRow').textContent = levelLabel || '—';
  document.getElementById('vTimeRow').textContent = timeLabel || '—';

  // Hero level badge + quick-stat strip — display-only, reuse the same
  // profile data already fetched for the detail rows below, just
  // surfaced earlier so the profile feels like an identity summary
  // rather than starting cold with a flat field list.
  const levelBadge = document.getElementById('vLevelBadge');
  if (levelLabel) { levelBadge.textContent = levelLabel; levelBadge.style.display = 'inline-block'; }
  else { levelBadge.style.display = 'none'; }

  const statGoal = document.getElementById('statGoal');
  const statTime = document.getElementById('statTime');
  if (goalLabel) { statGoal.style.display = 'flex'; document.getElementById('vGoalStat').textContent = goalLabel; }
  else { statGoal.style.display = 'none'; }
  if (timeLabel) { statTime.style.display = 'flex'; document.getElementById('vTimeStat').textContent = timeLabel; }
  else { statTime.style.display = 'none'; }
  document.getElementById('statStrip').style.display = (goalLabel || timeLabel) ? 'flex' : 'none';
}

function fillEditForm(){
  document.getElementById('f_name').value = profile.name || '';
  document.getElementById('f_age').value = profile.age || '';
  document.getElementById('f_city').value = profile.city || '';
  document.getElementById('f_sample').value = profile.english_sample || '';
  document.getElementById('charHint').textContent = (profile.english_sample || '').length + ' / 500';

  renderChips(document.getElementById('f_occ'), OCC_OPTIONS, profile.occupation_type, v => {
    profile.occupation_type = v; updateOccDetailField();
  });
  updateOccDetailField();
  renderIconChips(document.getElementById('f_goal'), GOAL_OPTIONS, profile.goal, v => profile.goal = v, 'goal-chip');
  renderCompactChips(document.getElementById('f_level'), LEVEL_OPTIONS, profile.self_level, v => profile.self_level = v);
  renderCompactChips(document.getElementById('f_time'), TIME_OPTIONS, profile.daily_time, v => profile.daily_time = v);
}

function updateOccDetailField(){
  const isStudent = profile.occupation_type === 'student';
  document.getElementById('occDetailLabel').textContent = isStudent ? 'Class/course' : 'Profession/role';
  document.getElementById('f_occdetail').value = isStudent ? (profile.class_grade || '') : (profile.profession || '');
}

const loadingMsg = document.getElementById('loadingMsg');
const viewMode = document.getElementById('viewMode');
const editForm = document.getElementById('editForm');
const editBtn = document.getElementById('editBtn');
const editActionsBar = document.getElementById('editActionsBar');
const pageTitle = document.getElementById('pageTitle');

function showViewMode(){
  editForm.classList.remove('open');
  viewMode.classList.remove('hidden');
  editBtn.style.display = 'flex';
  editActionsBar.classList.remove('open');
  pageTitle.textContent = 'Profile';
}
function showEditMode(){
  fillEditForm();
  viewMode.classList.add('hidden');
  editForm.classList.add('open');
  editBtn.style.display = 'none';
  editActionsBar.classList.add('open');
  pageTitle.textContent = 'Edit Profile';
}

// Cache-first: render full profile instantly on frame 0 (0ms delay, no dashes)
const cachedFull = getCachedFullProfile();
const cachedBasic = cachedFull ? null : getCachedProfileBasic();

if (cachedFull && cachedFull.profile) {
  profile = cachedFull.profile;
  email = cachedFull.email || '';
  loadingMsg.style.display = 'none';
  viewMode.classList.remove('hidden');
  renderView();
  document.getElementById('bottomBar').style.visibility = 'visible';
} else if (cachedBasic) {
  loadingMsg.style.display = 'none';
  viewMode.classList.remove('hidden');
  document.getElementById('vName').textContent = cachedBasic.name || '—';
  document.getElementById('vEmail').textContent = cachedBasic.email || '—';
  setAvatarInitial(cachedBasic.name);
  document.getElementById('bottomBar').style.visibility = 'visible';
}

(async () => {
  try {
    const data = await apiFetch('/users/me');
    profile = data.profile || {};
    email = data.email || '';
    loadingMsg.style.display = 'none';
    viewMode.classList.remove('hidden');
    renderView();
    document.getElementById('bottomBar').style.visibility = 'visible';
    setCachedFullProfile({ profile, email });
  } catch (err) {
    if (!cachedFull && !cachedBasic) {
      loadingMsg.innerHTML =
        `<span class="status-msg err" style="text-align:center;">Could not load profile: ${err.message}</span>`;
    }
  }
})();

editBtn.addEventListener('click', showEditMode);
document.getElementById('cancelBtn').addEventListener('click', showViewMode);

document.getElementById('f_age').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });
document.getElementById('f_sample').addEventListener('input', e => {
  const len = e.target.value.length;
  const hint = document.getElementById('charHint');
  hint.textContent = len + ' / 500';
  hint.classList.toggle('near-limit', len >= 450);
});

const saveBtn = document.getElementById('saveBtn');
const saveBtnLabel = document.getElementById('saveBtnLabel');

saveBtn.addEventListener('click', async () => {
  const isStudent = profile.occupation_type === 'student';
  const occDetail = document.getElementById('f_occdetail').value.trim();
  const payload = {
    name: document.getElementById('f_name').value.trim(),
    age: Number(document.getElementById('f_age').value),
    occupation_type: profile.occupation_type,
    class_grade: isStudent ? occDetail : undefined,
    profession: !isStudent ? occDetail : undefined,
    city: document.getElementById('f_city').value.trim(),
    goal: profile.goal,
    self_level: profile.self_level,
    daily_time: profile.daily_time,
    english_sample: document.getElementById('f_sample').value.trim()
  };
  const saveStatus = document.getElementById('saveStatus');
  saveStatus.className = 'status-msg'; saveStatus.textContent = '';
  saveBtn.disabled = true; saveBtn.classList.add('btn-loading'); saveBtnLabel.textContent = 'Saving…';
  try {
    const res = await apiFetch('/users/profile', { method: 'PATCH', body: JSON.stringify(payload) });
    profile = res.profile || profile;
    saveStatus.textContent = '';
    showViewMode();
    renderView();
  } catch (err) {
    saveStatus.className = 'status-msg err';
    saveStatus.textContent = err.message || 'Save nahi ho paya.';
  } finally {
    saveBtn.disabled = false; saveBtn.classList.remove('btn-loading'); saveBtnLabel.textContent = 'Save changes';
  }
});

// Proactively disable "Save changes" while offline — a PATCH request
// here is guaranteed to fail without a network. Only re-enables it if
// THIS code disabled it (WeakSet-tracked in offline-banner.js), so it
// never fights with showEditMode()/showViewMode() or the try/finally
// disable-while-saving cycle above.
import('./shared/offline-banner.js').then(({ disableOfflineFor }) => {
  disableOfflineFor([saveBtn]);
});
</script>
</body>
