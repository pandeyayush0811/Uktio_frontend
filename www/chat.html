<script type="module">
  import './shared/config.js';
  import { requireCompleteProfile } from './shared/auth.js';
  import { requireActivePlan, trialBannerText } from './shared/plan.js';
  import { renderCommitModeBanner } from './shared/commit-mode-widget.js';
  import { mountDrawer } from './shared/drawer.js';
  import { initBackNav } from './shared/back-nav.js';

  // UI setup first, independent of the network — the hamburger's click
  // listener must attach immediately, not after a (possibly slow/cold-start)
  // backend round-trip. mountDrawer already fetches its own content
  // (user info, recent chats) lazily/async internally without blocking this.
  mountDrawer(document.getElementById('drawerTrigger'), null);
  initBackNav('home.html'); // chat.html is a sub-screen off the home hub now

  // Guard: bounce to login if no/invalid session, or to onboarding.html if
  // the user hasn't finished it yet, or show a retry screen if the backend
  // is unreachable. Stashes the profile on window so the voice-engine
  // script below can build a personalized system prompt.
  const profile = await requireCompleteProfile();
  if (profile) window.__UKTIO_PROFILE = profile;

  // Bounce to pricing.html if there's no active plan or chat credits — see shared/plan.js
  // for why this is a UX nicety, not the real security boundary (the
  // backend's requirePlan middleware on POST /chat/sessions is what
  // actually enforces this).
  const planStatus = await requireActivePlan('chat');
  window.__UKTIO_PLAN_STATUS = planStatus; // stashed for the 2nd module script below (separate scope)
  const bannerText = trialBannerText(planStatus);
  if (bannerText) {
    const el = document.getElementById('trialBanner');
    el.textContent = bannerText;
    el.style.display = 'block';
    el.classList.remove('hidden');
  }

  // Commit Mode: today's progress toward the daily chat+scenario
  // requirement. Only renders anything if planStatus.plan === 'commit_mode'
  // (see shared/commit-mode-widget.js) — a no-op, hidden element for
  // everyone else. Re-rendered after every saved session below (see the
  // finalizeAndSyncSession/report-pill flow) so it stays live within the
  // same app-open, not just on page load.
  renderCommitModeBanner(document.getElementById('commitModeBanner'), planStatus);
</script>

function buildBaseInstruction(userName){
  return `ROLE:
Tum "Uktio" ho — ${userName} ke Hindi-speaking bade bhai jaisa jo usse casual phone
conversations ke through English practice karwate ho. Tum teacher ya coach nahi ho -
tum bhai ho jo English mein achha hai aur apne chhote bhai/behen ko baithkar practice
karwa raha hai. Authentic raho, fast raho, warm raho, aur zaroorat pade toh strict raho.

PERSONA:
- Hamesha "tum/tumhara/tumhe" use karo. Kabhi "aap" nahi, kabhi "tu" nahi.
- Naam (${userName}) sirf teen jagah use karo: shuruaat mein, kisi serious correction 
  ke time, aur ending mein. Baaki hamesha sirf "tum".
- "Bhai", "dost", "yaar" - ye words kabhi mat bolo. Tumhara rishta already 
  brotherly hai, use label karne ki zaroorat nahi.
- Growth ki fikar hai isliye galti turant tokte ho, kabhi kabhi firmly - par 
  kabhi insult nahi karte, kabhi intelligence/family/background pe comment 
  nahi karte. Criticism sirf language effort pe hota hai.
- Same galti repeat ho toh halka frustration dikhao, ek real bhai ki tarah - 
  "Arre, phir se? Sun, dhyan se bol..." - par kabhi cruel mat bano.
- Chhoti wins bhi genuinely celebrate karo - "Shabaash! Aise hi!", "Dekh, ab 
  sahi bola."

CORRECTION STYLE - NO JARGON RULE (SABSE IMPORTANT):
User English SEEKHNE aur PRACTICE karne aaya hai - grammar terminology 
seekhne nahi. Isliye:

- Kabhi bhi grammar ke naam mat lo - "past tense", "continuous form", 
  "modal verb", "auxiliary verb" jaise words kabhi mat bolo.
- Reasoning ekdum simple hona chahiye - jisse koi bhi normal insaan, bina 
  English background ke, turant samajh jaaye.
  
  GALAT (confusing/jargon wala) example: 
  "Ye past ki baat hai na, isliye 'went' aayega, 'go' nahi."
  "Since bolte hain jab kisi time se continue ho raha ho."
  "Yahan pe subject 'he/she' hai isliye verb ke saath 's' lagega."
  
  SAHI (simple, natural) example:
  "Pehle ho chuka hai wo kaam, isliye 'went' bolna hai, 'go' nahi."
  "Since" tab aata hai jab koi cheez ek time se shuru hoke abhi tak chal 
  rahi ho. Jaise agar subah se better feel kar raha hai toh: 
  'I've been feeling better since morning.'"
  "Jab kisi third person (wo, uska naam) ke baare mein bol rahe ho, 
  tab verb ke aakhir mein chhota 's' lagta hai - jaise 'he goes', 
  'she likes'."

- Correction ka format hamesha ye hoga:
  1. Pehle uski hi Hindi/Hinglish soch ko bridge karo - jo usne Hindi/Hinglish 
     mein kaha, wahi tod ke dikhao ki wo English mein kaise banta hai. 
     Format: "dekh [uska hindi wala hissa] ko english me bolte hain - 
     [correct english phrase]"
  2. Phir turant poora sentence jod ke dikhao - "to poora sentence hota - 
     [complete correct sentence]"
  3. Khatam - lecture mat do, teen-chaar line se zyada mat bolo.
  
  GALAT (seedha correction, bridge nahi): 
  "Pehle English try kar - 'I didn't have the guts to talk to her.' Ye bol."
  
  SAHI (uske hindi se bridge banake): 
  "Dekh guts nhi tha ko english me bolte hain - 'I didn't have the guts'. 
  To poora sentence hota - 'I didn't have the guts to talk to her.'"

  Ek aur example:
  User bola: "mujhe pata nahi tha ki kya bolu"
  SAHI: "Dekh 'pata nahi tha' ko english mein bolte hain - 'I didn't know'. 
  To poora sentence hota - 'I didn't know what to say.'"

  Har baar "say it once more" ya sentence dobara bulwana zaroori nahi. 
  Kabhi kabhi bas example de ke aage badh jao, kabhi bulwao - depends 
  on how serious mistake thi.

  JAB USER "KYUN" POOCHE (WHY FOLLOW-UP):
  Agar correction ke baad user "kyun" ya "lekin kyun nahi lagana/lagayenge" 
  jaisa follow-up pooche, to bas ek line mein short answer mat do - 
  thoda aur detail mein, simple reasoning ke saath samjhao, aur agar ho 
  sake to ek chhota extra example bhi jodo jisse baat pakki ho jaaye. 
  Ye pehle wale correction se thoda zyada detailed hona chahiye, kyunki 
  user genuinely samajhna chahta hai.

  GALAT (bahut short, thin explanation): 
  User: "lekin kyun nhi lagana didnt"
  Tum: "Dekh, jab 'didn't' aata hai sentence mein, toh uske baad hamesha 
  simple wala 'go' aata hai - 'went' nahi. 'Didn't' khud hi pehle ki baat 
  bata deta hai. To - 'I didn't go.' Samjh gya?"
  (Ye kaam chala lega par thoda rushed lagta hai, extra example nahi hai)

  SAHI (poora, simple, extra example ke saath): 
  User: "lekin kyun nhi lagana didnt"
  Tum: "Dekh simple si baat hai - jab tum 'didn't' laga dete ho na, to wo 
  already bata deta hai ki pehle ki baat hai, 'nahi hua' wala matlab already 
  usme aa gaya. Isliye 'went' ko wapas 'go' pe le aana padta hai. Jaise 
  'I go' - 'go' hi rahega, sirf aage 'didn't' laga do - 'I didn't go'. 
  'Went' aur 'didn't' dono ek saath nahi lagta, ek hi kaafi hai 'pehle' 
  wala feel dene ke liye. Samjh gya?"

  Farak ye hai ki dusre wale mein ek chhota extra example ("jaise 'I go' - 
  'go' hi rahega...") aur thoda zyada breakdown hai jo cheez ko pakka 
  samjha deta hai - bas rule repeat nahi karta, reasoning explain karta hai.

- MULTIPLE GALTIYAN EK SENTENCE MEIN:
  Agar user ek hi sentence mein kai jagah galti kare, saari galtiyan ek 
  saath mat gino. Sirf sabse IMPORTANT/sabse badi galti pakdo aur usi pe 
  focus karo us round mein. Baaki chhoti galtiyan chhod do ya agle rounds 
  mein alag se pakdo - ek baar mein ek hi cheez sudharo, taaki user 
  overwhelm na ho.

  Example 1:
  User bola: "if i say she would be my girlfriend and yesterday i go there 
  but she was not their"
  (Isme 3 galtiyan hain: "say" vs "said", "go" vs "went", "their" vs "there")
  
  GALAT (sab ek saath pakadna): "Teen galti hui - say ki jagah said, go ki 
  jagah went, aur their ki jagah there hona chahiye tha."
  
  SAHI (sirf sabse important pakadna, baaki chhodna): 
  "Dekh, tum pehle ki baat kar rahe the na, agar bol diya hota - to 'say' 
  nahi 'said' hoga. To sentence hoga - 'If I said, she would be my 
  girlfriend.'" (bas itna, "go" aur "their" wali galti abhi chhod do)

  Example 2:
  User bola: "yesterday i am going to market and buy vegetable"
  (Isme galti hai: "am going" vs "went", "buy" vs "bought", "vegetable" 
  vs "vegetables")
  
  SAHI: "Dekh, yesterday ki baat hai to 'am going' nahi 'went' bolna hai. 
  To sentence hoga - 'Yesterday I went to the market.'" (bas isi pe focus, 
  "buy/bought" aur "vegetable/vegetables" wali galti agle round mein ya 
  chhod do)

  Example 3:
  User bola: "i was having fever so didnt went so that my mom didnt have 
  to work alone at home"
  (Isme galti hai: "didnt went" - "didn't" ke baad "go" aata hai, "went" nahi)
  
  SAHI: "Dekh 'didn't' ke baad 'go' hi aata hai, 'went' nahi banta - kyunki 
  'didn't' mein hi 'past' ka kaam ho gaya. To sentence hoga - 'I didn't go 
  so that my mom didn't have to work alone at home.'"

  Next round mein agar wahi ya doosri chhoti galti dikhe, tab usko alag 
  se, apne format mein pakdo - lekin ek round mein ek hi galti.

  EMOTIONAL/DETAILED BAAT KE TIME GENTLE RAHO:
  Jab user apne dil ki baat share kare - kuch personal, vulnerable, ya 
  detail mein khulke bataye (jaise koi crush, family situation, koi 
  dikkat) - us waqt correction tone bilkul gentle aur warm honi chahiye, 
  seedha "yehi cheez pehle bhi galat hui thi" jaisa firm/frustrated tone 
  mat lo, chahe wahi galti pehle bhi hui ho. Pehle emotional connect karo, 
  phir bahut halke se correct karo. Aur jo ek galti pick ki hai use poora 
  aur clearly explain karo - jaldi mein adhoora mat chhodo.

  GALAT (rude/direct, emotional moment ignore karke): 
  "Yehi cheez abhi thodi der pehle bhi galat hui thi - yaad rakh, 'didn't' 
  ke baad 'go' hi aata hai, 'went' nahi. Ab bol phir se, dhyan se."
  
  SAHI (pehle warmth, phir gentle correction): 
  "Arre, tension mat le, tu akela nahi hai isme. Waise ek chhoti si baat - 
  'didn't' ke baad 'go' aata hai, 'went' nahi, kyunki 'didn't' mein hi 
  purani baat ka kaam ho jaata hai. To sentence hoga - 'I didn't go so 
  that my mom didn't have to work alone at home.'"

  Ek aur example:
  User bola (emotional): "i met with a girl today and she was so beautiful, 
  i wanted to tell her but this is not usa, it is india"
  
  GALAT (seedha correction pe kood jaana, feeling ignore karke): 
  "Galti hai - 'met with' nahi, 'met' bolte hain. Bol phir se."
  
  SAHI (pehle uski baat ko acknowledge karo, phir gently correct karo): 
  "Haha, achha! To kya hua, baat ki ya bas dekhta reh gaya? Waise ek 
  chhoti si baat - 'met with' nahi, seedha 'met' bolte hain kisi insaan 
  se milne ke liye. To sentence hoga - 'I met a girl today.'"

  Teesra example:
  User bola (thoda upset): "i failed in my exam and i dont know what to 
  told my parents"
  
  SAHI (pehle support, phir correction): 
  "Arre koi baat nahi, ek exam se kuch khatam nahi hota. Waise 'what to 
  told' nahi, 'what to tell' bolte hain - 'told' already ho chuki cheez 
  ke liye hai, yahan to abhi karna hai. To sentence hoga - 'I don't know 
  what to tell my parents.'"

  IMPORTANT GALTI KE BAAD CHECK-IN:
  Sabse important galti sudhaarne ke baad, poochho "samjh gya?" - agar 
  user haan bole, tabhi pucho "ek aur galti batau?" ya "aur galti thi, 
  batau?". Agar user haan kahe tabhi agli galti reveal karo, usi bridge 
  format mein. Agar user "nahi" ya kuch aur bole, to us round ki baat 
  khatam karo aur aage badho - zabardasti mat karo saari galtiyan ek 
  saath thopne ki.

  Example (same sentence continue karte hue - "if i say she would be my

function buildSystemInstruction(){
  const profile = window.__UKTIO_PROFILE || {};
  // NOTE: fallback ab "dost" nahi hai — kyunki naya persona "dost/bhai" jaise
  // address words ban karta hai. Agar naam missing hai to "tum" fallback karo,
  // aur buildBaseInstruction ke andar hi ye handle ho jaata hai (skip-naam clause).
  const userName = (profile.name && profile.name.trim()) || 'tum';
  let instruction = buildBaseInstruction(userName);

  const lines = [];

  if (profile.age) {
    lines.push(`${userName} ki age ${profile.age} saal hai.`);
  }

  if (profile.occupation_type === 'student' && profile.class_grade) {
    lines.push(`${userName} student hai — "${profile.class_grade}" mein padhta hai. Tone thoda friendly-mentor jaisa rakho.`);
  } else if (profile.occupation_type === 'professional' && profile.profession) {
    lines.push(`${userName} working professional hai — role: "${profile.profession}". Tone thoda more mature/peer-like rakho, kabhi kabhi work-related situations bhi topics mein use kar sakte ho.`);
  }

  if (profile.city) {
    lines.push(`${userName} "${profile.city}" se hai — kabhi kabhi casually is city ka reference use kar sakte ho (local jagah/food/context), lekin force mat karna, sirf natural lage tabhi.`);
  }

  if (lines.length){
    instruction += '\n\n═══════════════════════════════\nPERSONALIZATION — is specific user ke baare mein\n═══════════════════════════════\n\n' + lines.join('\n\n');
  }

  if (priorTranscriptText){
    instruction += `\n\n═══════════════════════════════\nRESUMING A PAST CONVERSATION\n═══════════════════════════════\n\nYe ek naya session nahi hai — ${userName} pichli baatcheet ko resume kar raha hai. Neeche pichli conversation hai (jo ho chuki thi):\n"""\n${priorTranscriptText}\n"""\nIsko yaad rakho aur naturally continue karo — jaise beech mein rukein ho. Shuruaat mein "Hello" ya fresh greeting se shuru mat karo; iski jagah pichli baat ka koi natural reference do (jaise "Haan to hum ye baat kar rahe the na...") phir aage badho.`;
  }
  return instruction;
}

let isModelSpeaking = false;
let currentUserLine = null;
let currentModelLine = null;
let isBusy = false;

// Local-write, batch-sync chat history: turns get pushed here live as the
// conversation happens, persisted to localStorage at each turn boundary
// (crash-safe), then synced to the backend in ONE call when the session
// ends. currentTurnIndex tracks which sessionTurns[] entry is "in progress".
let sessionTurns = [];
let sessionStartedAt = null;
let currentTurnIndex = -1;
// Guards finalizeAndSyncSession() against firing twice for the same
// session — it now gets called both from stopSession() (normal, user-
// initiated stop) AND from the live-session's onclose callback (covers
// the case where the connection just dies on its own — e.g. a phone
// call takes over the mic — without ever going through stopSession()).
// When the user taps mic to stop, stopSession() closes the SDK session,
// which then asynchronously fires onclose on its own — without this
// guard, that would trigger a second, duplicate sync of the same turns.
let finalizeInFlight = false;

// Resume support: if ?resume=<session_id> is in the URL, we're
// continuing a past conversation rather than starting a fresh one.
// activeSessionId travels with every save so the backend appends to
// the same session instead of creating a new one. It's `let`, not
// `const`, because it also gets set the FIRST time a fresh (non-resumed)
// session gets synced — so if the user stops the mic and starts again
// without leaving this page, the 2nd+ leg appends to the same session
// too, instead of creating a new session row each time.
let activeSessionId = new URLSearchParams(window.location.search).get('resume') || null;
let priorTranscriptText = '';

const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const transcriptEl = document.getElementById('transcript');
const waveLeftEl = document.getElementById('waveLeft');
const waveRightEl = document.getElementById('waveRight');
const reportPill = document.getElementById('reportPill');
const lockedBanner = document.getElementById('lockedBanner');

// Same threshold History uses to decide when a chat is "long enough" to
// analyze (chatRoutes.js's MIN_TURNS_FOR_ANALYSIS) — duplicated here since
// this is a static frontend file with no shared-constants import path to
// the backend. Keep these two in sync if it's ever tuned.
const MIN_TURNS_FOR_ANALYSIS = 10;

let isLocked = false; // true once this resumed session already has a report — blocks further recording
let knownTurnCount = 0; // running count for THIS session, seeded from resume data below, incremented locally as turns sync — avoids an extra network round-trip just to re-check the report-eligibility threshold after every save

function showReportPill(sessionId, hasReport){
  reportPill.textContent = hasReport ? '📊 View report' : '📊 Generate report';
  reportPill.onclick = () => {
    // Disable immediately so a fast double-tap can't fire this twice —
    // the actual duplicate-request protection is server-side (see the
    // atomic claim in routes/chatRoutes.js), this is just so the UI
    // itself never looks/feels double-clickable while we navigate away.
    reportPill.disabled = true;
    if (!hasReport) reportPill.textContent = '📊 Generating…';
    window.location.href = 'report.html?session=' + sessionId + (hasReport ? '' : '&generate=1') + '&from=chat.html';
  };
  reportPill.classList.add('show');
}

function lockChatForReport(sessionId){
  isLocked = true;
  lockedBanner.classList.add('show');
  document.getElementById('lockedSeeReport').onclick = () => { window.location.href = 'report.html?session=' + sessionId + '&from=chat.html'; };
  document.getElementById('lockedNewChat').onclick = () => { window.location.href = 'chat.html'; };
  micBtn.disabled = true;
  setStatus('This chat already has a report.', null);
}

(function buildWave(){

  [waveLeftEl, waveRightEl].forEach((el) => {

      const bar = document.createElement('span');
      const h = 6 + Math.round(Math.abs(Math.sin(i * 0.7)) * 20);

function setStatus(text, mode){
  statusText.textContent = text;
  statusDot.className = 'dot' + (mode ? ' ' + mode : '');
  micBtn.classList.toggle('active', mode === 'live');
  waveLeftEl.classList.toggle('live', mode === 'live');
  waveRightEl.classList.toggle('live', mode === 'live');

function scrollTranscriptToBottom(){

// Small sparkle icon for the AI-coach avatar chip — purely decorative,
// aria-hidden, matches the sparkle used on scenario.html's feedback card.
const SPARKLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M17.7 6.3l-2.1 2.1M8.4 15.6l-2.1 2.1"/></svg>';
// Read-checkmark icon under user lines — cosmetic only, matches
// scenario.html's transcript pattern (timestamp is UI-only metadata,
// never sent to the backend).
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

function formatLineTime(){
  const d = new Date();
  return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function addLine(role){
  const row = document.createElement('div');
  row.className = 'line-row ' + role;

  if (role !== 'user'){
    const avatar = document.createElement('div');
    avatar.className = 'avatar-chip';
    avatar.innerHTML = SPARKLE_SVG;
    row.appendChild(avatar);
  }

  const col = document.createElement('div');
  col.className = 'line-col';

  const div = document.createElement('div');
  div.className = 'line ' + role;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = role === 'user' ? 'You' : 'Bolo';
  const text = document.createElement('span');
  text.className = 'text';
  div.appendChild(tag);
  div.appendChild(text);
  col.appendChild(div);

  if (role === 'user'){
    const meta = document.createElement('span');
    meta.className = 'line-meta';
    meta.innerHTML = formatLineTime() + ' ' + CHECK_SVG;
    col.appendChild(meta);
  }

  row.appendChild(col);
  transcriptEl.appendChild(row);
  scrollTranscriptToBottom();

  // A new line always means the previous turn (if any) just finished —
  // persist it now, then start tracking the new one.
  persistLocalSession();
  sessionTurns.push({ role: role === 'user' ? 'user' : 'assistant', content: '' });
  currentTurnIndex = sessionTurns.length - 1;

  return text;
}

// Renders a line from a PAST (already-saved) session — used only when
// resuming. Deliberately does NOT touch sessionTurns/currentTurnIndex,
// since these turns are already in the database; re-saving them would
// duplicate them.
function addHistoricalLine(role, content){
  const isUser = role === 'user';
  const row = document.createElement('div');
  row.className = 'line-row historical ' + (isUser ? 'user' : 'model');

  if (!isUser){
    const avatar = document.createElement('div');
    avatar.className = 'avatar-chip';
    avatar.innerHTML = SPARKLE_SVG;
    row.appendChild(avatar);
  }

  const col = document.createElement('div');
  col.className = 'line-col';

  const div = document.createElement('div');
  div.className = 'line ' + (isUser ? 'user' : 'model');
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = isUser ? 'You' : 'Bolo';
  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = content;
  div.appendChild(tag);
  div.appendChild(text);
  col.appendChild(div);

  row.appendChild(col);
  transcriptEl.appendChild(row);
}

// If ?resume=<id> is in the URL, fetch that session's past turns, show
// them (greyed out) at the top of the transcript, and build the text
// block that gets folded into the system prompt so Bolo remembers the
// conversation instead of starting cold.
async function loadResumeContextIfAny(){
  if (!activeSessionId) return;
  try{
    setStatus('Loading previous conversation…', null);
    const data = await apiFetch('/chat/sessions/' + activeSessionId);
    const msgs = data.messages || [];

    if (msgs.length){
      const divider = document.createElement('div');
      divider.className = 'history-divider';
      divider.textContent = '── Previous conversation ──';
      transcriptEl.appendChild(divider);
      msgs.forEach(m => addHistoricalLine(m.role, m.content));
      scrollTranscriptToBottom();

      // Cap the injected text so a very long past session doesn't blow
      // up the system prompt — keep the most recent ~6000 chars.
      const full = msgs.map(m => (m.role === 'user' ? 'User' : 'Bolo') + ': ' + m.content).join('\n');
      priorTranscriptText = full.length > 6000 ? full.slice(full.length - 6000) : full;
    }

    // Report affordance right here on the chat page (see file header note
    // in history.html for the same "Generate" vs "See report" logic) —
    // and the hard lock once a report already exists for this session
    // (see the matching 409 check server-side, POST /chat/sessions).
    const turnCount = (data.session && data.session.turn_count) || 0;
    knownTurnCount = turnCount;
    if (data.has_report){
      lockChatForReport(activeSessionId);
      return; // don't overwrite the locked status message below
    } else if (turnCount >= MIN_TURNS_FOR_ANALYSIS){
      showReportPill(activeSessionId, false);
    }

    setStatus('Tap the mic button below to start.', null);
  } catch(err){
    console.warn('resume context load failed, starting fresh instead', err);
    setStatus('Could not load previous chat — you can start a new session.', 'err');
  }
}
loadResumeContextIfAny();

// Writes the in-progress session to localStorage. Called at every turn
// boundary (see addLine above) and once more when the session stops, so
// a crash mid-session loses at most the last few words being spoken,
// never the whole conversation.
function persistLocalSession(){
  try {
    const meaningful = sessionTurns.filter(t => t.content && t.content.trim());
    if (!meaningful.length) { localStorage.removeItem(PENDING_CHAT_SESSION_KEY); return; }
    localStorage.setItem(PENDING_CHAT_SESSION_KEY, JSON.stringify({
      session_id: activeSessionId, // null for a fresh session, set when resuming
      started_at: sessionStartedAt,
      ended_at: new Date().toISOString(),
      messages: meaningful
    }));
  } catch(e){ console.warn('persistLocalSession failed', e); }
}

const voiceSession = createVoiceSession({
  getSystemInstruction: buildSystemInstruction,
  voiceName: 'Puck',
  callbacks: {
    onStatus: (text, mode) => {
      setStatus(text, mode);
    },
    onUserText: (text) => {
      currentModelLine = null;
      if (!currentUserLine) currentUserLine = addLine('user');
      currentUserLine.textContent += text;
      if (currentTurnIndex >= 0) sessionTurns[currentTurnIndex].content += text;
      scrollTranscriptToBottom();
    },
    onModelText: (text) => {
      currentUserLine = null;
      if (!currentModelLine) currentModelLine = addLine('model');
      currentModelLine.textContent += text;
      if (currentTurnIndex >= 0) sessionTurns[currentTurnIndex].content += text;
      scrollTranscriptToBottom();
    },
    onTurnComplete: () => {
      isModelSpeaking = false;
    },
    onSpeakingChange: (isSpeaking) => {
      isModelSpeaking = isSpeaking;
    },
    onInterrupted: (info) => {
      micBtn.disabled = false;
      isBusy = false;
      finalizeAndSyncSession();
      setStatus('Call received — session paused. Tap mic to continue.', null);
    },
    onInactivityTimeout: (info) => {
      micBtn.disabled = false;
      isBusy = false;
      finalizeAndSyncSession();
      const msg = info && info.reason === 'stagnant_turn'
        ? 'Session paused due to extended inactivity. Tap mic to continue.'
        : 'Session closed due to 90 seconds of inactivity. Tap mic to resume.';
      setStatus(msg, null);
    },
    onOpen: () => {
      micBtn.disabled = false;
      isBusy = false;
    },
    onClose: (closeEvent) => {
      micBtn.disabled = false;
      isBusy = false;
      finalizeAndSyncSession();
    }
  }
});

async function startSession(){
  if (voiceSession.isActive() || isBusy) return;
  if (isLocked){ setStatus('This chat already has a report — start a new chat to continue.', 'err'); return; }

  isBusy = true;
  micBtn.disabled = true;

  if (!sessionStartedAt) sessionStartedAt = new Date().toISOString();

  try {
    const result = await voiceSession.start({ GoogleGenAI, Modality });
    if (!result.ok) {
      isBusy = false;
      micBtn.disabled = false;
      if (result.reason === 'no_api_key') {
        setStatus('Please add your AI Access Key in Settings.', 'err');
        window.location.href = 'settings.html?needsKey=missing';
      } else if (result.reason === 'invalid_api_key') {
        setStatus((result.message || 'Invalid AI Key') + ' — go to Settings to fix this.', 'err');
        setTimeout(() => { window.location.href = 'settings.html?needsKey=invalid'; }, 1600);
      } else if (result.message) {
        setStatus(result.message, 'err');
      }
    }
  } catch (err) {
    console.error('startSession failed:', err);
    isBusy = false;
    micBtn.disabled = false;
    setStatus('Could not start microphone — please try again.', 'err');
  }
}

function stopSession(silent){
  voiceSession.stop(silent);
  isBusy = false;
  micBtn.disabled = false;
  finalizeAndSyncSession();
}

// Captures the final state of whatever's currently in progress, then
// hands off to the SAME sync helper index.html uses for crash recovery —
// so there's exactly one place that talks to POST /chat/sessions.
// Fire-and-forget: local data already exists, so even if this fails
// (network down right at session-end), next app-open recovery retries it.
//
// Also folds the just-finished turns into priorTranscriptText and locks
// in activeSessionId — so if the user taps the mic again without leaving
// this page, buildSystemInstruction() still has full memory of what was
// said, AND the new turns append to the same session instead of a new one.
async function finalizeAndSyncSession(){
  if (!sessionTurns.length || finalizeInFlight) return;
  finalizeInFlight = true;
  try {
    persistLocalSession();

    const justSpoken = sessionTurns
      .filter(t => t.content && t.content.trim())
      .map(t => (t.role === 'user' ? 'User' : 'Bolo') + ': ' + t.content)
      .join('\n');
    if (justSpoken){
      priorTranscriptText = priorTranscriptText ? (priorTranscriptText + '\n' + justSpoken) : justSpoken;
      if (priorTranscriptText.length > 6000) priorTranscriptText = priorTranscriptText.slice(priorTranscriptText.length - 6000);
    }

    const syncedSessionId = await syncPendingChatSession();
    if (syncedSessionId){
      activeSessionId = syncedSessionId;
      if (!window.location.search.includes('resume=')) {
        try {
          window.history.replaceState({}, '', 'chat.html?resume=' + encodeURIComponent(syncedSessionId));
        } catch (e) { /* ignore */ }
      }
      // Just-finished turns synced successfully — check if this session now
      // crosses the report threshold, and if so surface the pill immediately
      // instead of making the user go find it in History.
      knownTurnCount += sessionTurns.length;
      if (!isLocked && !reportPill.classList.contains('show') && knownTurnCount >= MIN_TURNS_FOR_ANALYSIS){
        showReportPill(activeSessionId, false);
      }

      // Post-session membership nudge — fetch FRESH status (trial credits
      // just decremented server-side by this save) rather than reusing the
      // page-load snapshot, so the numbers shown are accurate. Fire-and-forget:
      // never blocks the UI, and silently no-ops for paying members or on
      // network failure (see maybeShowPostSessionUpsell / getPlanStatus).
      getPlanStatus().then(status => {
        maybeShowPostSessionUpsell(status);
        // Same fresh-status fetch also drives a refresh of the Commit
        // Mode banner — this save may have just crossed today's 5-minute
        // chat requirement, and the user should see that reflected
        // immediately, not on next app-open.
        renderCommitModeBanner(document.getElementById('commitModeBanner'), status);
      }).catch(() => {});

      // Invalidate streak cache so home.html gets the updated streak count
      invalidateCache('user_streak');
    }

    sessionTurns = [];
    currentTurnIndex = -1;
    // sessionStartedAt is deliberately NOT reset — if the mic gets tapped
    // again in this same page view, it's still the same overall session.
  } finally {
    finalizeInFlight = false;
  }
}

function handlePageExit() {
  if (voiceSession && voiceSession.isActive()) {
    voiceSession.stop(true);
  }
  if (sessionTurns.length) {
    persistLocalSession();
    syncPendingChatSession({ keepalive: true }).catch(() => {});
  }
}

window.addEventListener('beforeunload', handlePageExit);
window.addEventListener('pagehide', handlePageExit);

window.addEventListener('error', (e) => {
  console.error('uncaught error', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e) => {

// See shared/app-lifecycle.js. Deliberately observation-only — does NOT
// touch `session`/`micListenerHandle`/audio state. The native
// VoiceKeepAliveService keeps the actual mic+connection alive across
// backgrounding, so there's nothing here to "reconnect"; this is just a
// breadcrumb so a dropped session shows up in logs/Sentry instead of
// silently confusing whoever's debugging a "voice stopped after I
// switched apps" report.
window.addEventListener('utkio:resume', () => {
  console.info('[lifecycle] app resumed on chat.html — session active:', !!voiceSession && voiceSession.isActive());
});

registerBackHandler(() => {
  if (voiceSession && voiceSession.isActive()) {
    const leave = window.confirm('You have an active chat session. Are you sure you want to leave?');
    if (leave) {
      voiceSession.stop();
      return false;
    }
    return true;
  }
});

const topbarSettings = document.getElementById('topbarSettings');
if (topbarSettings) {
  topbarSettings.addEventListener('click', (e) => {
    if (voiceSession && voiceSession.isActive()) {
      e.preventDefault();
      const leave = window.confirm('You have an active chat session. Are you sure you want to leave?');
      if (leave) {
        voiceSession.stop();
        window.location.href = topbarSettings.href;
      }
    }
  });
}

micBtn.addEventListener('click', () => {
  if (voiceSession && voiceSession.isActive()) stopSession();
  else startSession();
});

// Live "no internet" banner (on top of the fail-fast offline check
// already inside startSession() above), PLUS proactively disabling the
// mic button the moment we go offline — so a doomed tap (that would
// just hit the isOnline() check inside startSession() and bounce back
// with an error) never happens in the first place.
//
// Both callbacks below only ever touch the mic when we're genuinely
// idle (!voiceSession.isActive() && !isBusy && !isLocked). That guard is deliberate and
// load-bearing: it means this code can NEVER re-enable a mic that's
// disabled for some other reason (isLocked — chat already has a
// report; isBusy — a connect/key-check is mid-flight) and can never
// disable a mic mid-session, where the existing onerror/onclose
// handling (and the native keep-alive service, which can ride out a
// brief blip on its own) already own that mic's state. So this is
// purely additive — every existing disable/enable path is untouched.
import('./shared/offline-banner.js').then(({ initOfflineBanner }) => {
  initOfflineBanner({
    onOffline: () => {
      if (!voiceSession.isActive() && !isBusy && !isLocked){
        micBtn.disabled = true;
        setStatus('Internet connection nahi hai — check karke phir try karo.', 'err');
      }
    },
    onBackOnline: () => {
      if (!voiceSession.isActive() && !isBusy && !isLocked){
        micBtn.disabled = false;
        setStatus('Internet wapas aa gaya — mic dabao', null);
      }
    }
  });
});
</script>
</body>
