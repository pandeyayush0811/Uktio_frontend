<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://utkio-backend.onrender.com https://pwdglktwuquoswqoyely.supabase.co https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://*.sentry.io https://*.ingest.sentry.io; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>Utkio</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap home-wrap">
  <header class="topbar">
    <button class="icon-btn" id="drawerTrigger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="icon-btn" href="settings.html?from=home.html" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>

  <div class="home-greeting-block">
    <div>
      <p class="home-eyebrow" id="homeEyebrow">Good morning</p>
      <h1 id="homeName" class="home-greeting-name"></h1>
    </div>
    <!-- Streak badge: displays real calculated practice streak from backend -->
    <div class="home-streak-badge" id="homeStreakBadge">
      <span class="home-streak-badge-value">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a6 6 0 1 1-12 0c0-1.677.782-3 2-4 .5.5 1 1.5 1 3z"/></svg>
        <span id="homeStreakValue">–</span>
      </span>
      <span class="home-streak-badge-label">Day streak</span>
    </div>
  </div>

  <!-- Hidden until renderAnnouncementBanner() finds an active, non-dismissed
       item in shared/announcement-banner.js. -->
  <div class="announcement-banner" id="announcementBanner" style="display:none;"></div>

  <!-- Hidden until renderCommitModeBanner() confirms the user is on
       Commit Mode and has today's progress to show. -->
  <div class="commit-mode-banner" id="commitBanner" style="display:none;"></div>

  <a class="hero-start-card" href="chat.html">
    <span class="hero-start-eyebrow">Ready to practice?</span>
    <img class="hero-start-image" src="assets/illustrations/start-chat.jpg" alt="" aria-hidden="true">
    <div class="hero-start-text">
      <span class="hero-start-label">Start a conversation</span>
      <span class="hero-start-sub">Live voice practice with AI</span>
    </div>
    <span class="hero-start-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </span>
  </a>

  <p class="promo-scroll-label">Explore</p>
  <div class="promo-scroll" id="promoScroll"></div>

  <div class="quick-nav-grid">
    <a class="quick-nav-tile" href="history.html">
      <span class="quick-nav-tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </span>
      <span class="quick-nav-tile-label">Chat history</span>
    </a>
    <a class="quick-nav-tile" href="profile.html">
      <span class="quick-nav-tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <span class="quick-nav-tile-label">Profile</span>
    </a>
  </div>
</div>

<script type="module">
import './shared/config.js';
import { requireCompleteProfile, getCachedProfileBasic, getCachedStreak, setCachedStreak, apiFetch } from './shared/auth.js';
import { getPlanStatus } from './shared/plan.js';
import { renderCommitModeBanner } from './shared/commit-mode-widget.js';
import { renderAnnouncementBanner } from './shared/announcement-banner.js';
import { mountDrawer } from './shared/drawer.js';
import { initBackNav } from './shared/back-nav.js';
import { PROMO_CARDS } from './shared/promo-cards.js';
import { syncDailyNotificationSchedule } from './shared/notifications.js';

initBackNav(null); // home.html is the true root now — back minimizes the app
mountDrawer(document.getElementById('drawerTrigger'), 'home');

// Time-of-day greeting — purely cosmetic, device local time is fine here.
const hour = new Date().getHours();
document.getElementById('homeEyebrow').textContent =
  hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

// Cache-first name (instant, matches the drawer's pattern) — corrected
// below once the profile fetch resolves, in case it changed elsewhere.
const cachedBasic = getCachedProfileBasic();
if (cachedBasic && cachedBasic.name) {
  document.getElementById('homeName').textContent = cachedBasic.name;
}

// Cache-first streak (instant, zero flicker on frame 0) — corrected
// below in background once the API resolves.
const cachedStreak = getCachedStreak();
if (cachedStreak && typeof cachedStreak.current_streak === 'number') {
  document.getElementById('homeStreakValue').textContent = cachedStreak.current_streak;
  if (cachedStreak.practiced_today) {
    document.getElementById('homeStreakBadge')?.classList.add('practiced');
  }
}

// Announcement banner is static config too (no network dependency) —
// render it immediately, same reasoning as the promo row below.
renderAnnouncementBanner(document.getElementById('announcementBanner'));

// Render the promo row immediately — it's static config, not
// network-dependent, so there's no reason to wait or show a loader.
const promoScroll = document.getElementById('promoScroll');
PROMO_CARDS.forEach(card => {
  const a = document.createElement('a');
  a.href = card.link;
  if (card.image) {
    // Illustration-backed tile (current design) — falls back to the
    // plain icon tile automatically for any card without an image.
    a.className = 'promo-card promo-card--image';
    a.innerHTML = `
      <img class="promo-card-image" src="${card.image}" alt="">
      <span class="promo-card-overlay">
        ${card.badge ? `<span class="promo-card-badge">${card.badge}</span>` : ''}
        <span class="promo-card-title">${card.title}</span>
      </span>
    `;
  } else {
    a.className = 'promo-card promo-card--plain';
    a.innerHTML = `
      <span class="promo-card-icon">${card.icon}</span>
      ${card.badge ? `<span class="promo-card-badge">${card.badge}</span>` : ''}
      <span class="promo-card-title">${card.title}</span>
      <span class="promo-card-desc">${card.desc}</span>
    `;
  }
  promoScroll.appendChild(a);
});

(async () => {
  // requireCompleteProfile() guards the page (redirects to login/onboarding
  // as needed) AND gives us the profile for the real name — same guard
  // chat.html used to use, now home.html owns it as the entry point.
  const profile = await requireCompleteProfile();
  if (!profile) return; // already redirected
  if (profile.name) document.getElementById('homeName').textContent = profile.name;

  // Commit Mode banner — no-op/hidden unless the user is actually on
  // that plan (see renderCommitModeBanner's own fail-open behavior).
  const planStatus = await getPlanStatus();
  renderCommitModeBanner(document.getElementById('commitBanner'), planStatus);

  // Real Day Streak — background revalidation
  let currentStreak = 0;
  try {
    const streakData = await apiFetch('/chat/streak');
    if (streakData && typeof streakData.current_streak === 'number') {
      currentStreak = streakData.current_streak;
      setCachedStreak(streakData);
      const streakValEl = document.getElementById('homeStreakValue');
      if (streakValEl) streakValEl.textContent = streakData.current_streak;
      const streakBadge = document.getElementById('homeStreakBadge');
      if (streakBadge) {
        streakBadge.classList.toggle('practiced', !!streakData.practiced_today);
      }
    }
  } catch (e) {
    // Fail-safe: cached streak stays on screen seamlessly
    currentStreak = cachedStreak?.current_streak || 0;
  }

  // Background Notification Scheduling Sync
  try {
    let chatSecondsDone = 0;
    let scenarioDone = false;
    if (planStatus?.commitProgress) {
      chatSecondsDone = planStatus.commitProgress.chat_seconds_done || 0;
      scenarioDone = planStatus.commitProgress.scenario_requirement_met || false;
    }
    syncDailyNotificationSchedule({
      plan: planStatus?.plan || profile?.plan || 'none',
      chatSecondsDone,
      scenarioDone,
      streak: currentStreak,
      name: profile?.name || 'there'
    });
  } catch (err) {
    console.warn('[home] Failed to sync notification schedule:', err);
  }
})();
</script>
</body>
</html>
